version: 2

seeds:
  - name: california_zip_codes
    description: >
      Derived from the California state geospatial portal, this seed encapsulates the "California Zip Codes" dataset.
      Geometries have been simplified to ensure WKT strings are below the Python import limit.
    url: "https://gis.data.ca.gov/datasets/CDEGIS::california-zip-codes/about"

  - name: maximum_extent_evacuation_zones
    description: >
      Based on the "Maximum Extent Evacuation Zones LA County Fires 2025" dataset from LA County's ArcGIS Hub, this seed
      defines the maximum extent area of Genasys zones that received evacuation orders or warnings during the LA County
      January 2025 fires. Geometries have been simplified to ensure WKT strings are below the Python import limit.
    url: "https://hub.arcgis.com/datasets/lacounty::maximum-extent-evacuation-zones-la-county-fires-2025/about"

  - name: TEST_PARTICIPANTS
    description: >
      Contains participant IDs that are known to be from test accounts and should be excluded from analysis.

  - name: ai_response_label_exemplars
    description: >
      Contains participant IDs, their AI response label, and the rationale for that label, for a set of exemplar
      responses that were used to calibrate the LLM's classifications of survey responses about the impact
      of AI on work. These exemplars were identified during the initial classification process, and were sanity
      checked by humans.

  - name: curated_discussion_themes
    description: >
      The manually-curated policy concepts identified by ODI staff across the phase 2
      discussion sessions, used by phase2_transcript_curated_theme_tags to tag transcript
      turns. Each row is one policy concept (the tagging unit), grouped into a two-level
      hierarchy: theme > subtheme > policy_concept. theme_id is a manually-assigned stable
      integer and the tagging model's incremental grain key — never renumber existing rows.
      Text columns can be reworded without orphaning rows, but doing so requires a
      --full-refresh of phase2_transcript_curated_theme_tags to re-tag and refresh the
      stored text. policy_concept and policy_concept_description are included in the
      tagging prompt verbatim. Keep the file plain ASCII/UTF-8 — Excel-on-Mac exports Mac
      Roman with curly apostrophes; replace them before committing.
    config:
      column_types:
        theme_id: integer
        policy_concept: varchar
        policy_concept_description: varchar
        subtheme: varchar
        theme: varchar

  - name: transcript_times
    description: >
      Manually-reviewed per-session discussion start/end offsets (read off each Zoom recording's
      scrubber), used to trim pre/post-session chatter from transcripts. session_id is the full
      filename-derived session_id (e.g. "GMT20260709-194459"), matched by exact equality
      downstream. Timecodes must be H:MM:SS (e.g. 0:30:00). Sessions with no row here pass
      through unfiltered.
