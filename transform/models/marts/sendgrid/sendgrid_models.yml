version: 2
models:
  - name: sendgrid_email_metrics
    description: Summary stats for Sendgrid emails
    columns:
      - name: subject_line
      - name: first_send_date
      - name: latest_send_date
      - name: recipients
      - name: sends
      - name: deliveries
      - name: opens
      - name: bounces
      - name: clicks
      - name: defers
      - name: unsubscribes
      - name: drops
      - name: spam_reports

  - name: sendgrid_clicks_metrics
    description: Clicks per URL per email subject line
    columns:
      - name: subject_line
      - name: url
      - name: total_clicks
      - name: click_rate
