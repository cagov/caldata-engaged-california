version: 2
models:
  - name: ai_engagement_phase2_zoom_registrations
    description: |
      Net-new Phase 2 Zoom registrations and declines per upload date, derived from cumulative
      upload snapshots using lag(). Staff and moderators are excluded. All registrations are
      counted, including multiple registrations by the same person. Use to track day-over-day
      registration progress toward the participation target.
    columns:
      - name: upload_date
        description: Date the snapshot was synced into Snowflake via Fivetran, used as the upload date.
      - name: new_registrations
        description: Net-new accepted registrants since the previous upload snapshot.
      - name: new_declines
        description: Net-new declined registrants since the previous upload snapshot.
      - name: total_registrations
        description: Cumulative count of accepted registrants as of this upload.
      - name: total_declines
        description: Cumulative count of declined registrants as of this upload.

  - name: ai_engagement_phase2_sendgrid_clicks
    description: |
      Daily clicks on links within Phase 2 sortition invite emails (subject line starting with
      'Join a discussion about AI'), broken out by URL. Filter to the Zoom scheduler URL
      to see clicks specifically on the registration link.
    columns:
      - name: click_date
        description: Date of the click, in Pacific time.
      - name: url
        description: The URL that was clicked.
      - name: clicks
        description: Number of clicks on that URL on that date.

  - name: phase2_poll_pre_and_post_counts
    description: |
      Respondent counts per (poll_stage, question, response) for poll questions 1-3, the
      questions asked on both the pre- and post-meeting polls. Excludes sessions where only one
      of the pre/post polls was launched, so pre vs. post counts reflect the same set of
      sessions. Question 4 (post-only) is out of scope here; see phase2_polls_question4.
    columns:
      - name: poll_stage
        description: Whether the poll was administered 'pre' or 'post' the session.
      - name: question_text
        description: Entire question as it appeared on the post-meeting poll.
      - name: question_num
        description: Poll question the response answers. Always 1, 2, or 3.
      - name: response
        description: Answer to the question on a likert scale.
      - name: responses
        description: Number of respondents who gave this response, for this question, by poll stage.

  - name: phase2_polls_question4
    description: |
      Respondent counts per (question, response) for poll question 4, which only exists on the
      post-meeting poll. Unlike phase2_poll_pre_and_post_counts, this mart does not exclude
      sessions where the pre-meeting poll wasn't launched, since question 4 has no pre-side to
      compare against and excluding those sessions would just discard valid post-poll responses.
    columns:
      - name: question_num
        description: Question number, always 4.
      - name: question_text
        description: Entire question as it appeared on the post-meeting poll.
      - name: response
        description: Response on a likert scale.
      - name: poll_stage
        description: Always 'post', since question 4 only exists on the post-meeting poll.
      - name: respondent_count
        description: Number of respondents who gave a certain response to a question.

  - name: phase2_zoom_transcripts_and_chats
    description: |
      This table combines the Phase 2 Zoom transcript turns and chat messages into one table of all
      Zoom engagement, with a common set of columns. Transcript turns are derived from the raw Phase 2
      transcripts, and chat messages are derived from the raw Phase 2 chat logs.
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
      - name: source
        description: |
          The source of the engagement data
          either 'speech' for transcript turns or 'chat' for chat messages.
      - name: src_ref
        description: |
          The reference to the source data
          either the start sequence number for transcript turns or the line number for chat messages.
      - name: start_sec
        description: The start time of the engagement data in seconds.
      - name: end_sec
        description: The end time of the engagement data in seconds.
      - name: speaker
        description: The display name of the speaker for the engagement data.
      - name: text
        description: The text of the engagement data.
      - name: turn_idx
        description: |
          Per-session chronological index (0-based) over all events, ordered by start_sec with
          deterministic tie-breaking on source and src_ref. This is the citation backbone of the
          AI tagging models: LLMs cite turns by this index, and verbatim quotes are always
          resolved from this table rather than trusted from model output.

  - name: phase2_sessions
    description: |
      Foundational sessions table with core session identifiers and timing information.
      Includes all session-level attributes from the transcript times seed.
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
      - name: session_date
        description: The date on which the session occurred.
      - name: discussion_start_sec
        description: When the real discussion begins, in seconds from recording start.
      - name: discussion_end_sec
        description: When the real discussion ends, in seconds from recording start.
      - name: session_number
        description: |
          1-based chronological numbering of sessions, ordered by session_date then session_id.
          The first session to occur receives session_number = 1.

  - name: phase2_transcript_session_summaries
    description: |
      Structured AI analysis of each phase 2 discussion session, flattened to one row per
      (session, section, theme). Each section is its own structured Cortex call over the full
      transcript (short per-section outputs avoid the transient timeouts that plagued
      whole-session calls); a failed call is not retried in-query. The returned themes cite
      turns by index only, and every cited index is validated against the session's real
      turns — unverifiable indices are dropped and themes with no valid supporting turn are
      removed (hallucination guardrail). Summary text excludes speaker names (PII) by design.

      Sessions that fit the ~500k-char context feed each section call the whole transcript
      (llm_input_kind = 'whole_transcript'); longer sessions are map-reduced — each ~400k-char
      chunk gets its own theme-extraction call and the section calls synthesize from those
      extractions (llm_input_kind = 'map_reduce').

      Every (session, section) pair appears in this table via a status row (theme_seq = 0) —
      check summary_status. FAILED pairs are retried automatically on the next run, and only
      failed sections re-bill. Incremental at the (session, section) grain, so LLM cost is
      only incurred for new sessions or retried failures. Prompts live at the top of the
      model SQL; editing them requires a --full-refresh to re-tag existing sessions.
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
        data_tests:
          - not_null
      - name: section
        description: |
          The summary section this row belongs to. 'overview' rows (one per session) carry the
          session summary text; every other section has one status row (theme_seq = 0) plus one
          row per extracted theme.
        data_tests:
          - accepted_values:
              values:
                - overview
                - protect_themes
                - gov_action_themes
                - general_themes
                - areas_of_tension
                - areas_of_consensus
                - deliberative_moments
      - name: theme_seq
        description: |
          1-based position of the theme within its section. 0 marks a section status row (and
          the overview row) rather than a theme.
      - name: theme_label
        description: |
          Short theme label, preferring participants' own words. Null for overview and section
          status rows.
      - name: summary_text
        description: |
          The overview text (overview rows) or the theme description. Contains no speaker names.
          Null on section status rows and when summary_status is not SUCCESS.
      - name: supporting_turn_idxs
        description: |
          Array of validated turn indices supporting this theme. Resolve against
          phase2_zoom_transcripts_and_chats (or use phase2_transcript_turn_tags) for verbatim quotes.
      - name: n_supporting_turns
        description: Number of validated supporting turn indices.
      - name: n_unverified_idxs_dropped
        description: |
          Number of turn indices the LLM returned that do not exist in the session and were
          dropped (hallucination guardrail).
      - name: summary_status
        description: |
          SUCCESS or FAILED, per (session, section) call (the Cortex call returned NULL,
          returned unparseable JSON, or a map chunk failed for an oversize session).
          Non-SUCCESS rows fail the run outright — Cortex COMPLETE failures are usually
          transient, so the recovery path is simply re-running the model, which retries only
          the failed sections.
        data_tests:
          - dbt_utils.not_accepted_values:
              values: ["FAILED"]
              severity: error
      - name: llm_input_kind
        description: |
          'whole_transcript' when the session fit a single Cortex call, or 'map_reduce' when the
          summary was synthesized from per-chunk theme extractions.
      - name: n_transcript_chars
        description: Rendered character length of the session transcript.
      - name: llm_total_tokens
        description: Total tokens used for this session, including any map-pass calls.
      - name: llm_model
        description: The LLM model used, per the LLM_MODEL environment variable (see docs/llm-cost-control.md).
      - name: processed_at
        description: Timestamp of when the session was tagged.

  - name: phase2_transcript_turn_tags
    description: |
      The pre-tagged transcript: one row per (tagged turn, theme), with verbatim turn text,
      speaker, and timestamps joined back from the source events. Because the AI only returns
      turn indices — validated upstream in phase2_transcript_session_summaries — quotes in this
      table cannot be hallucinated. Intended for dashboards to display theme-tagged turns
      without joins at read time. Speaker display names are PII; confirm display policy before
      exposing them publicly.
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
      - name: turn_idx
        description: The per-session chronological turn index (matches phase2_zoom_transcripts_and_chats).
      - name: section
        description: |
          The summary section the tag belongs to (protect_themes, gov_action_themes,
          general_themes, areas_of_tension, areas_of_consensus, or deliberative_moments).
      - name: theme_seq
        description: 1-based position of the theme within its section.
      - name: theme_label
        description: Short theme label, preferring participants' own words.
      - name: theme_description
        description: The theme description from the session summary.
      - name: start_sec
        description: The start time of the turn in seconds since the start of the session.
      - name: end_sec
        description: The end time of the turn in seconds since the start of the session.
      - name: source
        description: Either 'speech' for transcript turns or 'chat' for chat messages.
      - name: speaker
        description: The display name of the speaker (verbatim from the source data).
      - name: text
        description: The verbatim text of the turn.

  - name: phase2_transcript_cross_talk_moments
    description: |
      The top 5 minutes of heaviest cross-talk per Phase 2 transcript, i.e. the minutes with the
      most distinct speakers active, plus every turn spoken during those minutes. Minutes are
      ranked by density regardless of whether they clear the session's own average. Use to
      review moments where several people were talking over each other. Computed over the full
      transcript; not yet trimmed to exclude pre-session or post-session chatter.
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
        data_tests:
          - not_null
      - name: moment_rank
        description: |
          This session's cross-talk moments ranked 1 (heaviest) to 5, by distinct speakers
          then gap_sec then turn count. Distinguishes rows belonging to different moments
          within the same session.
      - name: start_minute
        description: The minute of the session (0-indexed, floor(start_sec / 60)) this cross-talk moment falls in.
      - name: n_distinct_speakers
        description: The number of distinct speakers who spoke during this minute.
      - name: avg_speakers_per_minute
        description: The session's average number of distinct speakers per minute, for comparison.
      - name: start_timestamp
        description: The start time of the turn, formatted as HH:MM:SS from the start of the transcript.
      - name: end_timestamp
        description: The end time of the turn, formatted as HH:MM:SS from the start of the transcript.
      - name: start_sec
        description: The start time of the turn in seconds since the start of the transcript.
      - name: end_sec
        description: The end time of the turn in seconds since the start of the transcript.
      - name: speaker
        description: The display name of the speaker for the turn.
      - name: text
        description: The text of the turn.
      - name: gap_sec
        description: |
          Seconds between this turn's end and the next turn's start, when the next turn is a
          different speaker (negative means the next speaker started before this turn ended,
          i.e. overlap; null if this is the last turn in the session).

  - name: phase2_transcript_longest_turns
    description: |
      The 1-3 longest speaking turns per participant in each Phase 2 transcript, with
      timestamps. Facilitators/staff are excluded via a display-name heuristic (not a verified
      staff list).
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
        data_tests:
          - not_null
      - name: speaker
        description: The display name of the participant.
      - name: start_timestamp
        description: The start time of the turn, formatted as HH:MM:SS from the start of the transcript.
      - name: end_timestamp
        description: The end time of the turn, formatted as HH:MM:SS from the start of the transcript.
      - name: start_sec
        description: The start time of the turn in seconds since the start of the transcript.
      - name: end_sec
        description: The end time of the turn in seconds since the start of the transcript.
      - name: duration_sec
        description: The duration of the turn in seconds (end_sec - start_sec).
      - name: word_count
        description: The approximate word count of the turn, counted by whitespace-separated tokens.
      - name: text
        description: The text of the turn.
