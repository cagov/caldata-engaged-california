version: 2

models:
  - name: youtube_video_engagement_daily
    description: |
      Daily YouTube video engagement stats aggregated by video and date across all countries.
      Unlisted videos are excluded. Rows with no matching video metadata are excluded.
    columns:
      - name: stats_date
        description: Date of the stats.
      - name: channel_id
        description: YouTube channel identifier.
      - name: video_id
        description: YouTube video identifier.
      - name: snippet_title
        description: Title of the video.
      - name: snippet_published_at
        description: Timestamp when the video was published.
      - name: snippet_description
        description: Description of the video.
      - name: snippet_tags
        description: Tags associated with the video.
      - name: privacy_status
        description: Privacy status of the video (public, private, or unknown).
      - name: views
        description: Total number of views across all countries.
      - name: engaged_views
        description: Number of views where the viewer watched past the initial seconds of the video.
      - name: comments
        description: Number of comments on the video.
      - name: likes
        description: Number of likes on the video.
      - name: dislikes
        description: Number of dislikes on the video.
      - name: shares
        description: Number of times the video was shared.
      - name: watch_time_minutes
        description: Total watch time in minutes across all countries.
      - name: video_duration_seconds
        description: Duration of the video in seconds.
      - name: avg_completion_pct
        description: |
          Average percentage of the video watched per view, calculated as total watch time
          divided by total views divided by video duration. Aggregated across all countries.

  - name: youtube_video_engagement_lifetime
    description: |
      All-time YouTube video engagement stats aggregated by video across all countries.
      Unlisted videos are excluded.
    columns:
      - name: channel_id
        description: YouTube channel identifier.
      - name: video_id
        description: YouTube video identifier.
      - name: snippet_title
        description: Title of the video.
      - name: snippet_published_at
        description: Timestamp when the video was published.
      - name: snippet_description
        description: Description of the video.
      - name: snippet_tags
        description: Tags associated with the video.
      - name: privacy_status
        description: Privacy status of the video (public, private, or unknown).
      - name: views_total
        description: Total all-time views.
      - name: engaged_views_total
        description: Total all-time engaged views.
      - name: comments_total
        description: Total all-time comments.
      - name: likes_total
        description: Total all-time likes.
      - name: dislikes_total
        description: Total all-time dislikes.
      - name: shares_total
        description: Total all-time shares.
      - name: watch_time_minutes_total
        description: Total all-time watch time in minutes.
      - name: video_duration_seconds
        description: Duration of the video in seconds.
      - name: avg_completion_pct
        description: |
          Average percentage of the video watched per view across all time, calculated as
          total watch time divided by total views divided by video duration.

  - name: youtube_channel_engagement_daily
    description: |
      Daily YouTube channel engagement stats aggregated by channel across all countries.
    columns:
      - name: stats_date
        description: Date of the stats.
      - name: channel_id
        description: YouTube channel identifier.
      - name: views_total
        description: Total views for the channel on this date.
      - name: engaged_views_total
        description: Total engaged views for the channel on this date.
      - name: comments_total
        description: Total comments across all videos on this date.
      - name: likes_total
        description: Total likes across all videos on this date.
      - name: dislikes_total
        description: Total dislikes across all videos on this date.
      - name: shares_total
        description: Total shares across all videos on this date.
      - name: watch_time_minutes_total
        description: Total watch time in minutes across all videos on this date.

  - name: youtube_channel_engagement_lifetime
    description: |
      All-time YouTube channel engagement stats aggregated by channel across all countries.
    columns:
      - name: channel_id
        description: YouTube channel identifier.
      - name: views_total
        description: Total all-time views.
      - name: engaged_views_total
        description: Total all-time engaged views.
      - name: comments_total
        description: Total all-time comments.
      - name: likes_total
        description: Total all-time likes.
      - name: dislikes_total
        description: Total all-time dislikes.
      - name: shares_total
        description: Total all-time shares.
      - name: watch_time_minutes_total
        description: Total all-time watch time in minutes.
      - name: watch_time_minutes_avg
        description: |
          Average daily watch time in minutes, calculated as total watch time divided
          by the number of distinct days with data.
  - name: linkedin_post_statistics
    description: LinkedIn post engagement statistics broken down by post, joining metadata with share metrics.
    columns:
      - name: post_id
        description: Unique identifier for each post in URN format.
      - name: post_published_at
        description: Timestamp when the post was first published.
      - name: post_commentary
        description: Text content of the post.
      - name: post_visibility
        description: Visibility setting of the post (e.g. PUBLIC).
      - name: post_lifecycle_state
        description: Current state of the post (e.g. PUBLISHED).
      - name: post_author_urn
        description: URN of the author who created the post.
      - name: impression_count
        description: Total number of times the post was shown in the feed, including passive views.
      - name: click_count
        description: Total number of clicks on the post.
      - name: like_count
        description: Total number of likes on the post.
      - name: comment_count
        description: Total number of comments on the post.
      - name: share_count
        description: Total number of times the post was shared.
      - name: engagement
        description: Engagement rate calculated as total organic interactions over impressions.

  - name: linkedin_page_seniority
    description: LinkedIn company page view statistics broken down by visitor seniority level.
    columns:
      - name: seniority_name
        description: Name of the seniority level (e.g. Senior, Director, Manager).
      - name: organization_urn
        description: URN of the organization this statistic belongs to.
      - name: all_page_views
        description: Total page views across all sections and devices.
      - name: all_mobile_page_views
        description: Total page views from mobile devices.
      - name: overview_page_views
        description: Views of the overview page section.
      - name: people_page_views
        description: Views of the people page section.
      - name: jobs_page_views
        description: Views of the jobs page section.
      - name: life_at_page_views
        description: Views of the life at page section.
      - name: insights_page_views
        description: Views of the insights page section.
      - name: careers_page_views
        description: Views of the careers page section.
      - name: products_page_views
        description: Views of the products page section.

  - name: linkedin_followers_by_industry
    description: LinkedIn follower counts for the organization broken down by industry.
    columns:
      - name: industry_name
        description: Name of the industry.
      - name: organization_urn
        description: URN of the organization this statistic belongs to.
      - name: organic_follower_count
        description: Number of followers gained organically.
      - name: paid_follower_count
        description: Number of followers gained through paid campaigns.
      - name: total_follower_count
        description: Total followers, calculated as organic plus paid.

  - name: linkedin_followers_by_seniority
    description: LinkedIn follower counts for the organization broken down by seniority level.
    columns:
      - name: seniority_name
        description: Name of the seniority level (e.g. Senior, Director, Manager).
      - name: organization_urn
        description: URN of the organization this statistic belongs to.
      - name: organic_follower_count
        description: Number of followers gained organically.
      - name: paid_follower_count
        description: Number of followers gained through paid campaigns.
      - name: total_follower_count
        description: Total followers, calculated as organic plus paid.

  - name: facebook_pages_post_metrics
    description: |
      Final model that aggregates key engagement and video metrics for each Facebook post.
    columns:
      - name: POST_ID
        description: Unique identifier for each Facebook post.
      - name: PAGE_ID
        description: Identifier for the Facebook page to which the post belongs.
      - name: POST_MESSAGE
        description: The text content of the Facebook post.
      - name: POST_TYPE
        description: The type of the Facebook post (e.g. status, link, photo, video).
      - name: PERMALINK_URL
        description: The URL of the Facebook post.
      - name: PICTURE_URL
        description: The URL of the image associated with the Facebook post.
      - name: CREATED_AT
        description: The timestamp when the Facebook post was created.
      - name: UPDATED_AT
        description: The timestamp when the Facebook post was last updated.
      - name: POST_VIEWS_TOTAL
        description: Total number of views for the post (including both organic and paid views).
      - name: CLICKS_TOTAL
        description: Total clicks on any part of the post (link, photo, name, etc.).
      - name: REACTIONS_TOTAL
        description: Total reactions across all reaction types (Like, Love, Haha, Wow, Sorry, Anger).
      - name: REACTIONS_LIKE
        description: Count of Like reactions.
      - name: REACTIONS_LOVE
        description: Count of Love reactions.
      - name: REACTIONS_HAHA
        description: Count of Haha reactions.
      - name: REACTIONS_WOW
        description: Count of Wow reactions.
      - name: REACTIONS_SORRY
        description: Count of Sorry (Sad) reactions.
      - name: REACTIONS_ANGER
        description: Count of Anger reactions.
      - name: POST_VIDEO_VIEWS
        description: Total video views (organic + paid). Null for non-video posts.
      - name: POST_VIDEO_VIEW_TIME
        description: Total milliseconds the video was watched across all views.
      - name: POST_VIDEO_AVG_TIME_WATCHED
        description: Average milliseconds watched per view.
      - name: POST_VIDEO_LENGTH
        description: The length of the video in seconds.
      - name: POST_VIDEO_COMPLETE_VIEWS_ORGANIC
        description: Total organic complete views of the video.
      - name: POST_VIDEO_COMPLETE_VIEWS_PAID
        description: Total paid complete views of the video.
      - name: TOTAL_ENGAGEMENTS
        description: Total engagements, calculated as the sum of all reactions and clicks.
      - name: ENGAGEMENT_RATE_PCT
        description: Engagement rate, calculated as (total reactions + clicks) / total views × 100.
      - name: CLICK_THROUGH_RATE_PCT
        description: Click-through rate, calculated as (clicks) / (views) × 100.
      - name: REACTION_RATE_PCT
        description: Reaction rate, calculated as (reactions) / (views) × 100.
      - name: IS_VIDEO_POST
        description: Indicates whether the Facebook post is a video post.
      - name: IS_PHOTO_POST
        description: Indicates whether the Facebook post is a photo post.
      - name: IS_STATUS_POST
        description: Indicates whether the Facebook post is a status post.
      - name: IS_LINK_POST
        description: Indicates whether the Facebook post is a link post.
  - name: instagram_business_post_metrics
    description: |
      Final model that aggregates key engagement and video metrics for each Instagram post.
    columns:
      - name: PERMALINK
        description: URL to instagram post.
      - name: MEDIA_TYPE
      - name: MEDIA_PRODUCT_TYPE
      - name: MEDIA_URL
        description: URL to the media contained within an instagram post.
      - name: CAPTION
      - name: CREATED_TIME
      - name: MEDIA_ID
      - name: LIKE_COUNT
      - name: COMMENT_COUNT
      - name: VIDEO_PHOTO_REACH
      - name: VIDEO_PHOTO_SAVED
      - name: CAROUSEL_ALBUM_ENGAGEMENT
      - name: CAROUSEL_ALBUM_REACH
      - name: REEL_REACH
      - name: VIDEO_PHOTO_ENGAGEMENT
      - name: REEL_COMMENTS
      - name: REEL_LIKES
      - name: REEL_SHARES
      - name: REEL_TOTAL_INTERACTIONS
      - name: _FIVETRAN_SYNCED
