          - name: STATISTICS_COMMENT_COUNT
          - name: PLAYER_EMBED_HTML
          - name: PLAYER_EMBED_HEIGHT
          - name: PLAYER_EMBED_WIDTH
          - name: _FIVETRAN_SYNCED

      - name: CHANNEL_BASIC_A_2
        description: Daily video stats per country
        columns:
          - name: _FIVETRAN_ID
