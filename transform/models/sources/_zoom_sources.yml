version: 2

sources:
  - name: ZOOM
    database: RAW_ENGCA_PRD
    schema: ZOOM
    description: |
      Manually downloaded files for the AI Engagement.
    tables:
      - name: ATTENDANCE_TRACKER
        description: |
          Manually uploaded participant lists recorded manually by staff and facilitators during the phase 2 live
          discussion events. This tells us which registrants attended and which were no-shows.
        columns:
          - name: invitee_first_name
            description: The user-input first name of the invitee
          - name: invitee_last_name
            description: The user-input last name of the invitee
          - name: invitee_email
            description: The email address of the invitee
          - name: start_date_time
            description: The start date and time of the Zoom meeting
          - name: end_date_time
            description: The end date and time of the Zoom meeting
          - name: actual_status
            description: |
              The actual attendance status of the invitee
              (Staff, Attended, No Show)
          - name: session_number
            description: The session number (1-15) of the engagement session

      - name: CHATS_RAW
        description: |
          Manually-uploaded chat transcripts from Zoom meetings.
          These chats are in a raw format, with the entire content
          of the meeting's chat box stored in a single column.
        columns:
          - name: filename
            description: The name of the file containing the chat transcript
          - name: file_content
            description: The entire content of the chat transcript file

      - name: TRANSCRIPTS_RAW
        description: |
          Manually-uploaded speech-to-text transcripts from Zoom meetings.
          These transcripts are in a raw format, with the entire content
          of the transcript for each meetingstored in a single column.
        columns:
          - name: filename
            description: The name of the file containing the chat transcript
          - name: file_content
            description: The entire content of the transcript file

  - name: GOOGLE_DRIVE_AI_POLLS
    database: RAW_ENGCA_PRD
    schema: ENGAGEDCA_GOOGLE_DRIVE_AI_POLLS
    description: |
      Manually downloaded Zoom poll reports.
    tables:
      - name: ZOOM_POLL_RESULTS_RAW
        description: |
          Pre- and post-meeting poll reports, distinguished by file name.
          No primary key, so every sync re-lands the full file as new rows.
        columns:
          - name: _FILE
            description: Source file name (report_poll_pre.csv or report_poll_post.csv).
          - name: _LINE
            description: Line number for this sync. Not stable across syncs.
          - name: _MODIFIED
            description: When the source file was last modified in Google Drive.
          - name: _FIVETRAN_SYNCED
            description: When this row was synced with Fivetran.
          - name: COLUMN_0
          - name: COLUMN_1
          - name: COLUMN_2
          - name: COLUMN_3
          - name: COLUMN_4
          - name: COLUMN_5
          - name: COLUMN_6
          - name: COLUMN_7
            description: In Poll Details, the response to question 1.
          - name: COLUMN_8
            description: In Poll Details, the response to question 2
          - name: COLUMN_9
            description: In Poll Details, the response to question 3.
          - name: COLUMN_10
            description: |
              In Poll Details, the response to question 4. Post poll only, no question 4 on pre.
