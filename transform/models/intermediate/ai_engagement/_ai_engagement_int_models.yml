version: 2
models:
  - name: int_ai_engagement_phase2_invitee_status
    description: |
      This table joins the sortition selections with the statuses of Phase 2 invitees. If a Phase 2 invitee email is
      not found in the Go Vocal user emails, and is not manually matched, the invitee status will be
      'could not match'. The join used is a full outer join in order to preserve any invitee emails that are not
      matched in the output. The final result is a single row per survey respondent, with the invitee status and
      attendee status determined by the status that is the farthest along in the Phase 2 process.
    columns:
      - name: survey_respondent_id
        description: User ID of the invitee.
      - name: invitee_email
        description: The email address of the invitee.
      - name: invite_count
        description: The number of times the invitee has been invited to participate in Phase 2.
      - name: list_sortition_rounds
        description: |
          Comma-separated list of the sortition rounds for which the survey respondent received a Phase 2 invite.
      - name: invitee_status
        description: |
          The status of the invitee (e.g., accepted, declined).
          If an invitee received more than one invitation, their status will be:
          - 'accepted' if they have accepted any invite
          - 'invitation open' if they have not accepted an invite for the most recent sortition round
          - 'declined' if they declined an invite, and have not accepted an invite, and do not have an invitation open
          - 'invitation closed' if they received an invite to an earlier round, but did not accept or decline it
      - name: email_match
        description: |
          If invitee email was manually matched, this field contains either:
          - email_address of the matched Go Vocal profile
          - 'could not match' if no match was found
      - name: accepted_event_start_date_time
        description: |
          The start date and time of the Phase 2 event that an invitee has accepted, if an invitee
          accepted the invitation. Null if the invitee has not accepted an invitation.
          'multiple events accepted' if an invitee is simultaneously registered for more than one event,
          which is typically expected only for moderators and staff and should therefore be filtered out.
      - name: attendee_status
        description: |
          The attendance status of the registrant, if an invitee has already been
          invited in a sortition lottery and accepted the invitation. Possible values: 'staff', 'attended',
          'session in the future', 'no show', 'not registered'.

  - name: int_phase2_speaker_gv_ids
    description: |
      This model matches each Phase 2 Zoom speaker to a Go Vocal participant using a date-scoped fuzzy-name
      join between attendee records and transcript speakers. It preserves the session-level speaker key,
      and resolves staff speakers to 'staff' while returning a survey respondent
      ID for matched invitees when available.
    columns:
      - name: session_date
        description: The date on which the Zoom session occurred.
      - name: speaker
        description: The display name of the speaker as it appeared in the Zoom transcript.
      - name: speaker_match_name
        description: The cleaned name of the speaker used as a helper column for matching.
      - name: invitee_match_name
        description: |
          The cleaned name of the invitee as it appears in the Zoom attendance tracker records,
          used as a helper column for matching.
      - name: name_match_score
        description: |
          The fuzzy match score between the speaker name and the matched invitee name.
          The score is based on exact matches of full name, first name, and last name, and attempted fuzzy matches
          full name, first name, and last name based on jarowinkler similarity.
          A higher score indicates a better match.
      - name: survey_respondent_id
        description: |
          The matched Go Vocal survey respondent ID for the speaker, or 'staff' when the speaker is staff,
          a moderator, or otherwise not mapped to a survey respondent. This may also show 'No GV account' if
          the speaker was matched to an attendee, but the attendee did not have a Go Vocal account.
      - name: attendee_status
        description: |
          The attendance status of the matched Phase 2 invitee, such as 'staff', 'attended'.
          Other attendee_statuses such as 'session in the future', 'no show', or 'not registered' are unexpected.
      - name: speaker_id
        description: Stable surrogate key for the transcript speaker within a single session.
      - name: session_id
        description: The unique identifier for each Zoom session.

  - name: int_phase2_transcript_turns
    description: |
      This table takes the raw Phase 2 transcripts and groups them into "turns" of speech, where a turn is defined as
      a continuous block of speech by a single speaker. Each turn is assigned a unique identifier (turn_grp) and the
      start and end sequence numbers of the cues that make up the turn are recorded. The text of the turn is also
      aggregated into a single block of text.
    columns:
      - name: session_id
        description: The unique identifier for each Zoom session.
      - name: start_seq
        description: The sequence number of the first cue in the turn.
      - name: end_seq
        description: The sequence number of the last cue in the turn.
      - name: speaker
        description: The display name of the speaker for the turn.
      - name: start_sec
        description: The start time of the turn in seconds.
      - name: end_sec
        description: The end time of the turn in seconds.
      - name: text
        description: The aggregated text of the turn, stitched together from the individual cues in the turn.
