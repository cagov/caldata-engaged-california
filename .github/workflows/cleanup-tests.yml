name: cleanup-tests
on:
  pull_request:
    types:
      - closed

env:
  DBT_PROFILES_DIR: transform/ci
  DBT_RAW_DB: RAW_ENGCA_PRD
  DBT_ANALYTICS_DB: ANALYTICS_ENGCA_DEV
  SNOWFLAKE_PRIVATE_KEY: ${{ SECRETS.SNOWFLAKE_PRIVATE_KEY_DEV }}
  SNOWFLAKE_USER: ${{ SECRETS.SNOWFLAKE_USER_DEV }}
  SNOWFLAKE_ACCOUNT: ${{ SECRETS.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_ROLE: TRANSFORMER_ENGCA_DEV
  SNOWFLAKE_WAREHOUSE: TRANSFORMING_XS_ENGCA_DEV
  SNOWFLAKE_DATABASE: TRANSFORM_ENGCA_DEV
  SNOWFLAKE_SCHEMA: GH_CI_PR_${{ github.event.number }}
  LLM_MODEL_LOW: ${{ secrets.LLM_MODEL_LOW}}
  LLM_MODEL_MED: ${{ secrets.LLM_MODEL_MED}}
  LLM_MODEL_HIGH: ${{ secrets.LLM_MODEL_HIGH}}
  ##this job doesn't run any LLM tests, but we need to set this env variable to avoid errors in dbt:
  LLM_MODEL: ${{ secrets.LLM_MODEL_LOW }}

jobs:
  cleanup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Wait for running CI tests of this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          for _ in $(seq 1 120); do
            active=$(gh run list --workflow=tests.yml --branch "$HEAD_REF" \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$active" = "0" ] && exit 0
            echo "$active tests run(s) still active, waiting..."
            sleep 30
          done
          echo "Timed out waiting for tests to finish" && exit 1
      - name: Install dbt packages
        run: uv run dbt deps --project-dir transform --target prd
      - name: Cleanup after tests (transform database)
        run: |
          uv run dbt run-operation drop_schemas_with_prefix \
          --project-dir transform \
          --args "{\"database_name\": \"$SNOWFLAKE_DATABASE\", \"prefix\": \"$SNOWFLAKE_SCHEMA\"}"
      - name: Cleanup after tests (analytics database)
        if: ${{ !cancelled() }}
        run: |
          uv run dbt run-operation drop_schemas_with_prefix \
          --project-dir transform \
          --args "{\"database_name\": \"$DBT_ANALYTICS_DB\", \"prefix\": \"$SNOWFLAKE_SCHEMA\"}"
