<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>finale keep runner (headless)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap">
</head>
<body>
<!-- Driven by keep_finale_from_chrome.js in headless Chrome. Reproduces one
     finale-layout-picker-v1.html run (same engine, same seed, same field, in
     Chrome's own rasterizer — Node's differs enough to pick another
     candidate), then:
       1. shrinks every label's text by ?text= at its FIXED position (a box
          shrinking about its own centre cannot create an overlap);
       2. box-places any label the run dropped into free space, nearest the
          centre (boxes are a superset of ink, so box-free = ink-free);
       3. scales the finished inline layout uniformly to the whirl field (a
          similarity transform keeps non-overlap) so both sketches match.
     Writes the WHIRL_FINALE_LAYOUTS object as JSON into #out. -->
<pre id="out"></pre>
<script src="../whirl-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="../d3-cloud-multiline.js"></script>
<script src="../whirl-layout.js"></script>
<script>
(async function(){
  "use strict";
  const Q = new URLSearchParams(location.search);
  const SEED = +(Q.get('seed') || 33), MULT = +(Q.get('mult') || 0.38), TEXT = +(Q.get('text') || 0.9), PACK = Q.get('pack') || 'dense';
  const out = document.getElementById('out');
  const log = [];
  const say = s => { log.push(s); };
  try {
    await Promise.all([document.fonts.load("700 16px 'Noto Sans', Arial, sans-serif"), document.fonts.load("400 16px 'Noto Sans', Arial, sans-serif")]);
    await document.fonts.ready;

    const DATA = window.WHIRL_DATA;
    // same constants as finale-layout-picker-v1.html
    const MULT_INLINE = 0.638;
    const PRESETS = { whirl: { w: 2340, h: 1140, mult: 1.0 }, inline: { w: 1400, h: 820, mult: MULT_INLINE } };
    const MAX_VOTES = Math.max(...DATA.phase2.map(c => c.votes));
    const phase2Base = v => (17 + 29 * Math.sqrt(v / MAX_VOTES)) * 1.3;
    function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const meas = document.createElement('canvas').getContext('2d');
    function buildWords(WL, mult){
      return DATA.phase2.map((c, i) => {
        const fontSize = phase2Base(c.votes) * mult;
        const lines = WL.wrapTwoLines(c.label, fontSize, 700, fontSize * 11);
        const w = Math.max(...lines.map(l => WL.textWidth(l, fontSize, 700))) + 8;
        const h = lines.length * fontSize * 1.22 + 6;
        return { i, label: c.label, subtheme: c.subtheme, votes: c.votes, fontSize, lines, w, h };
      });
    }

    // 1. the picker run
    const P = PRESETS.inline;
    const WL = WhirlLayout({ rand: mulberry32(SEED), cloud: () => d3.layout.cloud(), measureCtx: meas });
    const probe = WL.fontProbe();
    if (Math.abs(probe - 902.42) > 0.75) throw new Error(`font probe ${probe}: Noto Sans is not the font in use`);
    const words = buildWords(WL, MULT);
    const area = Q.get('area') ? +Q.get('area') : Math.min(1, Math.max(0.3, MULT / P.mult));
    const LW = Math.round(P.w * area), LH = Math.round(P.h * area);
    const placed = WL.layoutFinaleBalanced(words, { width: LW, height: LH, padding: 2, weight: 700, pack: PACK });
    const m = WL.lastFinale;
    const dropped = words.filter(w => !placed.includes(w));
    say(`seed ${SEED} x${MULT} ${PACK} area ${(area * 100).toFixed(1)}% (${LW}x${LH}): candidate #${m.candidate}, placed ${placed.length}/${words.length}` + (dropped.length ? `, dropped ${dropped.map(w => `"${w.label}"`).join(', ')}` : ''));
    for (const w of placed){ w.x0 = w.x; w.y0 = w.y; }

    // 2. shrink text at fixed positions
    const MULT2 = +(MULT * TEXT).toFixed(4);
    const WL2 = WhirlLayout({ rand: Math.random, cloud: () => null, measureCtx: meas });
    const words2 = buildWords(WL2, MULT2);
    for (const w of words2){ const src = words[w.i]; if (placed.includes(src)){ w.x = src.x0; w.y = src.y0; } }

    // 3. box-place dropped labels
    const PAD = 3;
    const overlap = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 + PAD && Math.abs(a.y - b.y) < (a.h + b.h) / 2 + PAD;
    function placeInGap(word, all, W, H){
      const fixed = all.filter(f => f !== word && typeof f.x === 'number');
      const span = { x0: Math.min(...fixed.map(f => f.x - f.w / 2)), x1: Math.max(...fixed.map(f => f.x + f.w / 2)),
                     y0: Math.min(...fixed.map(f => f.y - f.h / 2)), y1: Math.max(...fixed.map(f => f.y + f.h / 2)) };
      let best = null;
      for (let y = -H / 2 + word.h / 2; y <= H / 2 - word.h / 2; y += 2){
        for (let x = -W / 2 + word.w / 2; x <= W / 2 - word.w / 2; x += 2){
          const t = { x: Math.round(x), y: Math.round(y), w: word.w, h: word.h };
          if (fixed.some(f => overlap(t, f))) continue;
          const inside = t.x - t.w / 2 >= span.x0 && t.x + t.w / 2 <= span.x1 && t.y - t.h / 2 >= span.y0 && t.y + t.h / 2 <= span.y1;
          const d = Math.hypot(t.x, t.y * 1.4) + (inside ? 0 : 400);
          if (!best || d < best.d) best = { x: t.x, y: t.y, d };
        }
      }
      if (!best) return false;
      word.x = best.x; word.y = best.y; return true;
    }
    for (const w of words2){
      if (typeof w.x === 'number') continue;
      if (!placeInGap(w, words2, P.w, P.h)) throw new Error(`no gap for "${w.label}" at x${MULT2}; use a smaller text scale`);
      say(`gap-placed "${w.label}" at (${w.x}, ${w.y})`);
    }

    // 4. scale to the whirl field
    const K = PRESETS.whirl.w / P.w;
    const MULT_W = +(MULT2 * K).toFixed(4);
    const wordsW = buildWords(WL2, MULT_W);
    for (const w of wordsW){ const src = words2[w.i]; w.x = Math.round(src.x * K); w.y = Math.round(src.y * K); }
    const wrapDiff = wordsW.filter(w => w.lines.join('\n') !== words2[w.i].lines.join('\n'));
    if (wrapDiff.length) say(`NOTE ${wrapDiff.length} label(s) wrap differently at the whirl size: ${wrapDiff.map(w => w.label.slice(0, 30)).join('; ')}`);

    const record = (list, field, mult, presetKey, note) => ({
      field, layoutArea: area, pack: PACK, presetKey, fontMultiplier: mult, seed: SEED, padding: 2, weight: 700,
      fontProbe: probe, createdAt: new Date().toISOString(),
      metrics: { dropped: 0, imbalance: m.imbalance, touching: m.touching, hole: m.hole, candidate: m.candidate, source: note },
      items: list.map(w => ({ label: w.label, x: w.x, y: w.y, fontSize: w.fontSize, lines: w.lines, subtheme: w.subtheme })),
    });
    const layouts = {};
    layouts[`${P.w}x${P.h}`] = record(words2, { w: P.w, h: P.h }, MULT2, 'inline', `picker seed ${SEED} x${MULT} ${PACK}; text x${TEXT} at the run's positions; ${dropped.length} dropped label(s) box-placed into gaps`);
    layouts[`${PRESETS.whirl.w}x${PRESETS.whirl.h}`] = record(wordsW, { w: PRESETS.whirl.w, h: PRESETS.whirl.h }, MULT_W, 'whirl', `the 1400x820 layout scaled x${K.toFixed(4)}`);
    out.textContent = JSON.stringify({ ok: true, log, probe, layouts });
  } catch (e){
    out.textContent = JSON.stringify({ ok: false, log, error: String(e && e.stack || e) });
  }
  document.title = 'DONE';
})();
</script>
</body>
</html>
