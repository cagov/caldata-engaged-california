<meta charset="utf-8">
<title>Phase 1 to 14 conversations</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&family=Noto+Sans:wght@400;600&family=Noto+Serif:wght@700&display=swap');

:root{
  --ink:#1E1E1E;
  --gray:#444444;
  --line:#DEDEE1;
  --blue:#0D4F8C;
  --paper:#FFFFFF;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:28px 20px 48px;
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans',Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
#stage{
  width:100%;
  max-width:1040px;
}
canvas{
  width:100%;
  height:auto;
  display:block;
}
.controls{
  width:100%;
  max-width:1040px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
button{
  font-family:'Noto Sans Mono',ui-monospace,monospace;
  font-size:12px;
  letter-spacing:.04em;
  color:var(--gray);
  background:transparent;
  border:1px solid var(--line);
  border-radius:2px;
  padding:7px 12px;
  cursor:pointer;
  transition:border-color .15s, color .15s;
}
button:hover{color:var(--blue);border-color:var(--blue)}
button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.spacer{flex:1}
.hint{
  width:100%;
  max-width:1040px;
  font-size:12.5px;
  line-height:1.55;
  color:var(--gray);
}
.hint code{font-family:'Noto Sans Mono',ui-monospace,monospace;font-size:12px;color:var(--blue)}
@media (max-width:640px){ .spacer{display:none} }
</style>

<div id="stage"><canvas id="c" width="1040" height="740"
  aria-label="Animation showing 2,700 phase one participants narrowing to 103, who then separate into 14 conversation groups arranged in a ring."></canvas></div>

<div class="controls">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <div class="spacer"></div>
  <button class="jump" data-s="0">1 · Phase 1</button>
  <button class="jump" data-s="1">2 · Selected</button>
  <button class="jump" data-s="2">3 · Phase 2</button>
  <button class="jump" data-s="3">4 · Conversations</button>
  <button id="loop" aria-pressed="true">Loop</button>
</div>

<p class="hint">Edit <code>CONFIG.groups</code> for the real per-conversation counts and <code>CONFIG.palette</code> for brand colors — everything else recalculates. Space plays or pauses; arrow keys step between stages.</p>

<script>
/* ─────────────────────────────────────────────────────────────
   CONFIG — the only block you should need to touch
   ───────────────────────────────────────────────────────────── */
const CONFIG = {
  phase1: 2700,

  // PLACEHOLDER — 14 conversations, currently summing to 103.
  // Replace with the real headcounts, in the order you want them
  // to appear clockwise from the top of the ring.
  groups: [10, 9, 9, 8, 8, 8, 7, 7, 7, 7, 6, 6, 6, 5],

  // Optional: short labels drawn beside each count, e.g. ["Session A", ...]
  groupNames: [],

  // PLACEHOLDER — ODI data-viz palette, cycled around the ring.
  palette: ['#0D4F8C','#E3881B','#634EAF','#E45D48','#3BAA91',
            '#A35F0E','#3D6A7F','#058A32','#825A99'],

  dropped: '#C9CCD2',   // the 2,597 who don't continue
  ink:     '#1E1E1E',
  gray:    '#444444',

  dwell:      1500,     // ms held at each stage before auto-advancing
  finalDwell: 6500,     // the conversations stage holds longer, so the orbit reads
  transition: 2200,     // ms of movement between stages
  orbitSpeed: 0.34      // radians/sec — about 18s per revolution
};

const PHASE2 = CONFIG.groups.reduce((a, b) => a + b, 0);
const NGROUPS = CONFIG.groups.length;

const COPY = [
  { eyebrow:'STAGE 1',       title:'Phase 1',
    sub:'Everyone who took part in the opening round.',
    count:CONFIG.phase1, unit:'participants' },
  { eyebrow:'STAGE 2',       title:'Moving forward',
    sub:'A smaller group continues into the next round.',
    count:PHASE2, unit:'continue to phase 2' },
  { eyebrow:'STAGE 3',       title:'Phase 2',
    sub:'The full phase 2 cohort, gathered.',
    count:PHASE2, unit:'participants' },
  { eyebrow:'STAGE 4',       title:'The conversations',
    sub:'Small groups of uneven size, each around a facilitator.',
    count:NGROUPS, unit:'conversations' }
];

/* ── canvas setup ─────────────────────────────────────────── */
const W = 1040, H = 740;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ── geometry ─────────────────────────────────────────────── */
const CX = W / 2, CY = 435;

// deterministic shuffle so the same 103 dots light up every run
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20250825);

// Stage 1: a grid holding all of phase 1
const COLS = Math.ceil(Math.sqrt(CONFIG.phase1 * 1.45));
const ROWS = Math.ceil(CONFIG.phase1 / COLS);
const GAP  = Math.min(760 / COLS, 540 / ROWS);
const GX   = CX - (COLS - 1) * GAP / 2;
const GY   = CY - (ROWS - 1) * GAP / 2;

// even packing inside a circle (phyllotaxis)
function packed(n, cx, cy, radius){
  const out = [];
  for (let i = 0; i < n; i++){
    const r = radius * Math.sqrt((i + 0.5) / n);
    const a = i * 2.39996323;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

// build dots
const dots = [];
for (let i = 0; i < CONFIG.phase1; i++){
  dots.push({
    grid: [GX + (i % COLS) * GAP, GY + Math.floor(i / COLS) * GAP],
    kept: false, group: -1, color: CONFIG.dropped,
    pos: [0, 0], from: [0, 0], alpha: 0, aFrom: 0, delay: 0,
    drift: [0, 0]
  });
}
for (const d of dots){
  const a = rand() * Math.PI * 2, m = 90 + rand() * 260;
  d.drift = [d.grid[0] + Math.cos(a) * m, d.grid[1] + Math.sin(a) * m];
}

// pick which dots continue
const order = dots.map((_, i) => i);
for (let i = order.length - 1; i > 0; i--){
  const j = Math.floor(rand() * (i + 1));
  [order[i], order[j]] = [order[j], order[i]];
}
const keptIdx = order.slice(0, PHASE2);
keptIdx.forEach(i => dots[i].kept = true);

// Stage 3: everyone gathered at the centre
const gather = packed(PHASE2, CX, CY, 7 * Math.sqrt(PHASE2) * 1.8);

// assign groups by gathered angle, so the fan-out doesn't cross itself
const byAngle = keptIdx.map((idx, k) => {
  let a = Math.atan2(gather[k][1] - CY, gather[k][0] - CX) + Math.PI / 2;
  if (a < 0) a += Math.PI * 2;
  return { idx, k, a };
}).sort((p, q) => p.a - q.a);

// Stage 4: the ring of conversations, each orbiting its facilitator.
// The center is reserved for the facilitator, so participants sit on one
// or more concentric rings around it rather than filling the disc.
const SEAT_SPACING = 15;

function orbitRings(n){
  const single = Math.max(20, n * SEAT_SPACING / (2 * Math.PI));
  if (single <= 46) return [{ r: single, count: n, rate: 1 }];
  const inner = Math.max(3, Math.round(n * 0.35));
  const rIn = Math.max(20, inner * SEAT_SPACING / (2 * Math.PI));
  return [
    { r: rIn,      count: inner,     rate: 1.4 },  // inner ring turns faster
    { r: rIn + 17, count: n - inner, rate: 1 }
  ];
}

const clusters = CONFIG.groups.map((n, g) => {
  const rings = orbitRings(n);
  return {
    n, rings,
    rc:  Math.max(...rings.map(r => r.r)) + 7,
    ang: -Math.PI / 2 + g * (Math.PI * 2 / NGROUPS),
    color: CONFIG.palette[g % CONFIG.palette.length],
    name:  CONFIG.groupNames[g] || ''
  };
});

// widen the ring until the largest conversation clears its neighbors
const maxRc = Math.max(...clusters.map(c => c.rc));
const RING_R = Math.min(214, Math.max(150, NGROUPS * (2 * maxRc + 24) / (2 * Math.PI)));

for (const cl of clusters){
  cl.x = CX + Math.cos(cl.ang) * RING_R;
  cl.y = CY + Math.sin(cl.ang) * RING_R;
}

let cursor = 0;
clusters.forEach((cl, g) => {
  for (const ring of cl.rings){
    for (let s = 0; s < ring.count; s++){
      const rec = byAngle[cursor++];
      const d = dots[rec.idx];
      d.group  = g;
      d.color  = cl.color;
      d.gather = gather[rec.k];
      d.orbit  = {
        r:    ring.r,
        rate: ring.rate,
        a0:   cl.ang + Math.PI + (s / ring.count) * Math.PI * 2
      };
    }
  }
});

/* ── per-stage targets ────────────────────────────────────── */
let spin = 0;   // accumulated orbit rotation, in radians

function orbitPos(d){
  const cl = clusters[d.group];
  const a  = d.orbit.a0 + spin * d.orbit.rate;
  return [cl.x + Math.cos(a) * d.orbit.r, cl.y + Math.sin(a) * d.orbit.r];
}

function target(d, stage){
  switch (stage){
    case 0: return { p:d.grid,    r:GAP * 0.27, a:0.88, c:rgb(CONFIG.palette[0]) };
    case 1: return d.kept
      ? { p:d.grid,    r:GAP * 0.40, a:1,    c:rgb(d.color) }
      : { p:d.grid,    r:GAP * 0.24, a:0.13, c:rgb(CONFIG.dropped) };
    case 2: return d.kept
      ? { p:d.gather,  r:7,          a:1,    c:rgb(d.color) }
      : { p:d.drift,   r:GAP * 0.2,  a:0,    c:rgb(CONFIG.dropped) };
    case 3: return d.kept
      ? { p:orbitPos(d), r:6,          a:1,    c:rgb(d.color) }
      : { p:d.drift,     r:GAP * 0.2,  a:0,    c:rgb(CONFIG.dropped) };
  }
}

/* ── animation state ──────────────────────────────────────── */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const lerp = (a, b, t) => a + (b - a) * t;

// Colors travel as [r,g,b] arrays and are only stringified at draw time.
// Round-tripping through "rgb(...)" strings fed NaN back into the parser,
// and canvas silently drops an invalid fillStyle — leaving dots on the
// previous fill, or on the default black.
function toRGB(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
const rgbCache = new Map();
function rgb(h){
  let v = rgbCache.get(h);
  if (!v){ v = toRGB(h); rgbCache.set(h, v); }
  return v;
}
function mixColor(A, B, t){
  return [lerp(A[0],B[0],t), lerp(A[1],B[1],t), lerp(A[2],B[2],t)];
}
function css(c){
  return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
}

let stage = 0, prevStage = 0, t = 1, playing = true, looping = true, last = performance.now();

function snapTo(s){
  prevStage = stage = s; t = 1;
  for (const d of dots){
    const g = target(d, s);
    d.pos = [g.p[0], g.p[1]]; d.from = [g.p[0], g.p[1]];
    d.alpha = d.aFrom = g.a; d.r = d.rFrom = g.r;
    d.cNow = d.cFrom = g.c;
  }
}
function goTo(s){
  if (s === stage && t >= 1) return;
  prevStage = stage; stage = s; t = reduced ? 1 : 0;
  for (const d of dots){
    d.from = [d.pos[0], d.pos[1]];
    d.aFrom = d.alpha; d.rFrom = d.r; d.cFrom = d.cNow;
    d.delay = (d.kept ? 0 : 0.08) + rand() * 0.22;
  }
  if (reduced) snapValues();
}
function snapValues(){
  for (const d of dots){
    const g = target(d, stage);
    d.pos = [g.p[0], g.p[1]]; d.alpha = g.a; d.r = g.r; d.cNow = g.c;
  }
}

snapTo(0);
const dwellFor = s => s === 3 ? CONFIG.finalDwell : CONFIG.dwell;
let dwellLeft = CONFIG.dwell;

/* ── draw ─────────────────────────────────────────────────── */
function fmt(n){ return n.toLocaleString('en-US'); }

function header(){
  const from = COPY[prevStage], to = COPY[stage];
  const k = easeInOut(Math.min(1, t * 1.6));

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  ctx.globalAlpha = 1;
  ctx.font = "400 11px 'Noto Sans Mono', ui-monospace, monospace";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText((k < 0.5 ? from.eyebrow : to.eyebrow).split('').join(' '), 60, 46);

  ctx.globalAlpha = Math.abs(k - 0.5) * 2;
  ctx.font = "700 30px 'Noto Serif', Georgia, serif";
  ctx.fillStyle = CONFIG.palette[0];
  ctx.fillText(k < 0.5 ? from.title : to.title, 60, 82);

  ctx.font = "400 14.5px 'Noto Sans', Arial, sans-serif";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText(k < 0.5 ? from.sub : to.sub, 60, 106);
  ctx.globalAlpha = 1;

  // the number counts down through the funnel
  const val = Math.round(lerp(from.count, to.count, easeInOut(t)));
  ctx.textAlign = 'right';
  ctx.font = "700 50px 'Noto Sans Mono', ui-monospace, monospace";
  ctx.fillStyle = CONFIG.ink;
  ctx.fillText(fmt(val), 980, 84);

  ctx.globalAlpha = Math.abs(k - 0.5) * 2;
  ctx.font = "400 12.5px 'Noto Sans', Arial, sans-serif";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText(k < 0.5 ? from.unit : to.unit, 980, 106);
  ctx.globalAlpha = 1;
}

function ringLabels(){
  // fade in only as the clusters settle
  const vis = stage === 3 ? easeInOut(Math.max(0, (t - 0.55) / 0.45)) : 0;
  if (vis <= 0.01) return;

  ctx.globalAlpha = vis;
  for (const cl of clusters){
    ctx.beginPath();
    ctx.arc(cl.x, cl.y, cl.rc + 11, 0, Math.PI * 2);
    ctx.strokeStyle = cl.color;
    ctx.globalAlpha = vis * 0.28;
    ctx.lineWidth = 1;
    ctx.stroke();

    const lr = RING_R + cl.rc + 30;
    const lx = CX + Math.cos(cl.ang) * lr;
    const ly = CY + Math.sin(cl.ang) * lr;

    ctx.globalAlpha = vis;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "700 15px 'Noto Sans Mono', ui-monospace, monospace";
    ctx.fillStyle = CONFIG.ink;
    ctx.fillText(String(cl.n), lx, cl.name ? ly - 8 : ly);

    if (cl.name){
      ctx.font = "400 11px 'Noto Sans', Arial, sans-serif";
      ctx.fillStyle = CONFIG.gray;
      ctx.fillText(cl.name, lx, ly + 8);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function facilitators(){
  const vis = stage === 3 ? easeInOut(Math.max(0, (t - 0.45) / 0.55)) : 0;
  if (vis <= 0.01) return;

  ctx.globalAlpha = vis;
  for (const cl of clusters){
    // white gap first, so the facilitator reads as separate from the orbit
    ctx.beginPath(); ctx.arc(cl.x, cl.y, 11, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();

    ctx.beginPath(); ctx.arc(cl.x, cl.y, 7.5, 0, Math.PI * 2);
    ctx.fillStyle = cl.color; ctx.fill();

    ctx.beginPath(); ctx.arc(cl.x, cl.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }

  // role legend — shape carries the distinction, not color
  const lx = 60, ly = H - 30;
  ctx.fillStyle = CONFIG.gray;
  ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(lx + 108, ly, 7, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.gray; ctx.fill();
  ctx.beginPath(); ctx.arc(lx + 108, ly, 2.8, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = "400 12px 'Noto Sans', Arial, sans-serif";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText('Participant', lx + 12, ly);
  ctx.fillText('Facilitator', lx + 120, ly);

  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  header();
  ringLabels();

  for (const d of dots){
    if (d.alpha <= 0.008) continue;
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = css(d.cNow);
    ctx.beginPath();
    ctx.arc(d.pos[0], d.pos[1], d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  facilitators();
}

/* ── loop ─────────────────────────────────────────────────── */
function frame(now){
  const dt = Math.min(now - last, 50); last = now;

  if (playing){
    spin += dt / 1000 * CONFIG.orbitSpeed;

    if (t < 1){
      t = Math.min(1, t + dt / CONFIG.transition);
      const span = 0.7;
      for (const d of dots){
        const g = target(d, stage);
        const lt = easeInOut(Math.max(0, Math.min(1, (t - d.delay) / span)));
        d.pos[0] = lerp(d.from[0], g.p[0], lt);
        d.pos[1] = lerp(d.from[1], g.p[1], lt);
        d.alpha  = lerp(d.aFrom, g.a, lt);
        d.r      = lerp(d.rFrom, g.r, lt);
        d.cNow   = mixColor(d.cFrom, g.c, lt);
      }
      if (t >= 1) dwellLeft = dwellFor(stage);
    } else {
      dwellLeft -= dt;
      if (dwellLeft <= 0){
        if (stage < 3) goTo(stage + 1);
        else if (looping) goTo(0);
        else { playing = false; playBtn.textContent = 'Play'; }
      }
    }
  }

  // the conversations keep turning after everyone has taken their seat
  if (t >= 1 && stage === 3){
    for (const d of dots){
      if (!d.kept) continue;
      const p = orbitPos(d);
      d.pos[0] = p[0]; d.pos[1] = p[1];
    }
  }

  draw();
  markButtons();
  requestAnimationFrame(frame);
}

/* ── controls ─────────────────────────────────────────────── */
const playBtn = document.getElementById('play');
const jumps = [...document.querySelectorAll('.jump')];
const loopBtn = document.getElementById('loop');

function markButtons(){
  jumps.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === stage)));
}

playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing && t >= 1 && stage === 3 && !looping) goTo(0);
};
document.getElementById('restart').onclick = () => {
  snapTo(0); spin = 0; dwellLeft = CONFIG.dwell; playing = true; playBtn.textContent = 'Pause';
};
jumps.forEach(b => b.onclick = () => {
  goTo(+b.dataset.s); dwellLeft = dwellFor(stage);
});
loopBtn.onclick = () => {
  looping = !looping;
  loopBtn.setAttribute('aria-pressed', String(looping));
};

addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowRight' && stage < 3){ goTo(stage + 1); dwellLeft = dwellFor(stage); }
  if (e.key === 'ArrowLeft'  && stage > 0){ goTo(stage - 1); dwellLeft = dwellFor(stage); }
});

(document.fonts ? document.fonts.ready : Promise.resolve())
  .then(() => requestAnimationFrame(frame));
</script>
