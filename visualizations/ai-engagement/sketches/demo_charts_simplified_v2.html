<style>
  :root {
    --surface: #ffffff;
    --surface-sunken: #f4f4f4;
    --ink: #1f2225;
    --ink-secondary: #4c5257;
    --ink-muted: #6e757b;
    --border: #d9dad6;
    --grid: #c2c2c2;
    --hover-band: #f0f0f0;
    --unknown: #9aa0a6;
    --focus: #2E6C8A;
    color-scheme: light;

    /* Categorical band palette — fixed hue order, never cycled within a set of 8. */
    --cat-1: #2a78d6; /* blue */
    --cat-2: #eb6834; /* orange */
    --cat-3: #1baf7a; /* aqua */
    --cat-4: #eda100; /* yellow */
    --cat-5: #e87ba4; /* magenta */
    --cat-6: #008300; /* green */
    --cat-7: #4a3aa7; /* violet */
    --cat-8: #e34948; /* red */

    /* Diverging pair for AI response (positive/negative), plus its two
       auxiliary categories: neutral (muted grey) and mixed (violet, the
       "both signals present" blend of the two poles). */
    --div-pos: #2a78d6;
    --div-neg: #e34948;
    --div-mixed: #4a3aa7;
    --div-neutral: #898781;
  }
  :root[data-theme-resolved="dark"] {
    --surface: #1a1a19;
    --surface-sunken: #232322;
    --ink: #f1f1ef;
    --ink-secondary: #c3c5c2;
    --ink-muted: #9a9d99;
    --border: #3a3a38;
    --grid: #4a4a48;
    --hover-band: #2a2a29;
    --unknown: #767c81;
    --focus: #74BCDD;
    color-scheme: dark;

    --cat-1: #3987e5;
    --cat-2: #d95926;
    --cat-3: #199e70;
    --cat-4: #c98500;
    --cat-5: #d55181;
    --cat-6: #008300;
    --cat-7: #9085e9;
    --cat-8: #e66767;

    --div-pos: #3987e5;
    --div-neg: #e66767;
    --div-mixed: #9085e9;
    --div-neutral: #898781;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 15px/1.5 "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1320px; margin: 0 auto; padding: 40px 32px 64px; }

  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 26px; color: var(--ink-secondary); max-width: 80ch; }

  /* --- controls --------------------------------------------------------- */
  .controls {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px;
    margin-bottom: 26px;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-muted);
  }
  .select-wrap { position: relative; }
  select {
    appearance: none;
    font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1.2;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px 52px 14px 18px;
    min-width: 250px;
    box-shadow: 0 4px 10px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.07);
    cursor: pointer;
  }
  select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .select-wrap svg {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--focus);
  }

  .toggle {
    margin-left: auto; display: inline-flex; gap: 2px; padding: 3px;
    background: var(--surface-sunken); border-radius: 10px;
  }
  .toggle button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--ink-secondary);
    background: none; border: 0; border-radius: 8px;
    padding: 9px 14px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .toggle button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* --- figure ----------------------------------------------------------- */
  .figure {
    display: grid; grid-template-columns: minmax(0, 1fr) 250px;
    gap: 36px; align-items: start;
  }
  @media (max-width: 940px) { .figure { grid-template-columns: 1fr; } }

  .plot { position: relative; }
  .plot svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline {
    stroke: var(--grid); stroke-width: 1; stroke-dasharray: 6 4;
    shape-rendering: crispEdges;
  }
  .tick-text { font-size: 12px; fill: var(--ink-muted); }
  .cat-text { font-size: 11.5px; fill: var(--ink-secondary); }
  .total-text {
    font-size: 12px; font-weight: 600; fill: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }
  .hit { fill: transparent; }
  .slot.is-active .hit { fill: var(--hover-band); }
  .seg-label {
    font-size: 11px; font-weight: 600; fill: #fff;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }

  .tooltip {
    position: absolute; z-index: 5; pointer-events: none; opacity: 0;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; width: max-content; max-width: 320px;
    box-shadow: 0 6px 20px rgba(0,0,0,.13);
    font-size: 13px; transition: opacity .08s ease;
  }
  .tooltip[data-show="1"] { opacity: 1; }
  .tooltip .tt-title { font-weight: 600; margin-bottom: 6px; white-space: nowrap; }
  .tooltip .tt-row {
    display: flex; align-items: center; gap: 18px;
    justify-content: space-between; white-space: nowrap; line-height: 1.65;
  }
  .tooltip .tt-key { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-secondary); }
  .tooltip .tt-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip .tt-row.is-focus b { color: var(--ink); }
  .tooltip .tt-total {
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
  }
  .tooltip .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  /* --- legend ----------------------------------------------------------- */
  .key h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-muted); margin: 0 0 8px;
  }
  .key p { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-muted); }
  .key ul { list-style: none; margin: 0; padding: 0; }
  .key li {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--ink-secondary); padding: 3px 0;
  }
  .key .swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; }
  .key .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .key .count {
    margin-left: auto; color: var(--ink-muted);
    font-variant-numeric: tabular-nums; flex: none;
  }
  .key li.is-zero { opacity: .5; }

  /* --- table ------------------------------------------------------------ */
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  caption { text-align: left; font-weight: 600; padding-bottom: 8px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--ink-muted); font-weight: 600; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  td { font-variant-numeric: tabular-nums; }
  tfoot td, tfoot th { font-weight: 600; border-bottom: 0; }

  [hidden] { display: none !important; }

  .notes { margin-top: 34px; font-size: 13px; color: var(--ink-muted); max-width: 92ch; }
  .notes h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); margin: 0 0 8px; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes li { margin-bottom: 5px; }
</style>
</head>

<script>
(function () {
  const DATA = window.RING_DATA;
  const DIMS = DATA.dimensions;

  // Geometry. Width follows the bar count so 13 bars don't jam their labels.
  const H = 470;
  const M = { top: 26, right: 14, bottom: 96, left: 56 };
  const PLOT_H = H - M.top - M.bottom;
  const BASE_PLOT_W = 640;
  const MIN_SLOT = 62;
  const MAX_BAR = 62;
  const SEG_GAP = 2;      // surface gap between stacked segments
  const RADIUS = 4;       // rounded cap on the top segment only

  // Colour. Age keeps a single-hue sequential ramp (light -> dark, monotonic
  // lightness) since it's the one dimension where position means something.
  // AI response is polarity, so it gets a diverging pair (positive/negative)
  // plus its two auxiliary categories. Everything else gets the fixed-order
  // categorical set. "Not stated" is always neutral grey and never part of
  // any of the three scales.
  const SEQ_HUE = 245, SEQ_CHROMA = 0.11, SEQ_L_HI = 0.80, SEQ_L_LO = 0.36;
  const NOMINAL = [
    "var(--cat-1)", "var(--cat-2)", "var(--cat-3)", "var(--cat-4)",
    "var(--cat-5)", "var(--cat-6)", "var(--cat-7)", "var(--cat-8)",
  ];
  const DIVERGING = {
    Positive: "var(--div-pos)",
    Negative: "var(--div-neg)",
    Mixed: "var(--div-mixed)",
    Neutral: "var(--div-neutral)",
  };
  // "age" stays sequential; "sentiment" (AI response) goes diverging;
  // everything else — including the otherwise-ordinal role/workstatus dims —
  // is treated as categorical here.
  function colorMode(dim) {
    if (dim.id === "age") return "sequential";
    if (dim.id === "sentiment") return "diverging";
    return "categorical";
  }

  const el = (tag, attrs) => {
    const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    return n;
  };
  const fmt = (n) => n.toLocaleString();
  // "Region" -> "region", but "AI response" keeps its acronym.
  const lower = (label) =>
    /^[A-Z][a-z]/.test(label) ? label[0].toLowerCase() + label.slice(1) : label;
  const article = (label) => {
    const l = lower(label);
    return (/^[aeiouAEIOU]/.test(l) ? "an " : "a ") + l;
  };
  const pct = (n, d) => d ? (100 * n / d).toFixed(1) + "%" : "—";

  // --- OKLCH -> sRGB hex, chroma walked down to stay in gamut -------------
  function oklabToLinear(L, a, b) {
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
    return [
      +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
    ];
  }
  const inGamut = (rgb) => rgb.every((c) => c >= -0.0005 && c <= 1.0005);
  function enc(c) {
    const v = Math.max(0, Math.min(1, c));
    const s = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
    return Math.round(s * 255).toString(16).padStart(2, "0");
  }
  function oklch(L, C, hDeg) {
    const h = (hDeg * Math.PI) / 180;
    let c = C, rgb;
    for (let i = 0; i < 40; i++) {
      rgb = oklabToLinear(L, c * Math.cos(h), c * Math.sin(h));
      if (inGamut(rgb)) break;
      c *= 0.92;
    }
    return "#" + rgb.map(enc).join("");
  }

  const BASE36 = "0123456789abcdefghijklmnopqrstuvwxyz";
  const decode = (s) => [...s].map((ch) => BASE36.indexOf(ch));

  const N = DATA.total;
  const attended = decode(DATA.attended);
  const codes = {};
  Object.values(DIMS).forEach((d) => (codes[d.id] = decode(d.codes)));

  // --- state ---------------------------------------------------------------
  let barsId = DATA.defaultWedge;   // region
  let bandsId = DATA.defaultShade;  // age
  let showChart = true;

  function bandColors(dim) {
    const mode = colorMode(dim);
    const real = dim.categories.length - 1;   // last is Not stated
    const out = new Array(dim.categories.length);
    for (let i = 0; i < real; i++) {
      if (mode === "sequential") {
        const t = real === 1 ? 0 : i / (real - 1);
        out[i] = oklch(SEQ_L_HI - t * (SEQ_L_HI - SEQ_L_LO), SEQ_CHROMA, SEQ_HUE);
      } else if (mode === "diverging") {
        out[i] = DIVERGING[dim.categories[i]] || "var(--div-neutral)";
      } else {
        out[i] = NOMINAL[i % NOMINAL.length];
      }
    }
    out[dim.notStatedIndex] = "var(--unknown)";
    return out;
  }

  // Bottom-to-top stacking order: Not stated first, then the band categories
  // in reverse so the darkest ramp step sits at the base and the lightest on
  // top. The legend is drawn top-of-stack first so it maps onto the bar.
  function stackOrder(dim) {
    const real = [...dim.categories.keys()].filter((i) => i !== dim.notStatedIndex);
    return [dim.notStatedIndex, ...real.reverse()];
  }

  function crosstab(bars, bands) {
    const bc = codes[bars.id], sc = codes[bands.id];
    const grid = bars.categories.map(() => new Array(bands.categories.length).fill(0));
    const att = bars.categories.map(() => new Array(bands.categories.length).fill(0));
    for (let p = 0; p < N; p++) {
      grid[bc[p]][sc[p]]++;
      att[bc[p]][sc[p]] += attended[p];
    }
    // Tallest bar first makes the shape readable; Not stated is parked last
    // regardless of its size so it never leads the chart.
    const order = [...bars.categories.keys()].sort((a, b) => {
      const an = a === bars.notStatedIndex, bn = b === bars.notStatedIndex;
      if (an !== bn) return an ? 1 : -1;
      return bars.counts[b] - bars.counts[a];
    });
    return { grid, att, order };
  }

  function niceMax(v) {
    if (v <= 0) return 10;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    for (const s of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
      if (s * mag >= v) return s * mag;
    }
    return 10 * mag;
  }
  function ticks(max) {
    const step = niceMax(max / 4);
    const out = [];
    for (let t = 0; t <= max + 1e-6; t += step) out.push(Math.round(t));
    return out;
  }

  function wrap(text, maxChars, maxLines) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    for (const w of words) {
      const cand = line ? line + " " + w : w;
      if (cand.length > maxChars && line) { lines.push(line); line = w; }
      else line = cand;
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) {
      const kept = lines.slice(0, maxLines - 1);
      kept.push(lines.slice(maxLines - 1).join(" "));
      return kept;
    }
    return lines;
  }

  // Rounded top, square bottom — only for the segment that caps the bar.
  function segPath(x, y, w, h, round) {
    if (h <= 0.4) return "";
    if (!round) return `M${x} ${y}h${w}v${h}h${-w}Z`;
    const r = Math.min(RADIUS, w / 2, h);
    return `M${x} ${y + h} L${x} ${y + r} Q${x} ${y} ${x + r} ${y}` +
           ` L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r}` +
           ` L${x + w} ${y + h} Z`;
  }

  const plot = document.getElementById("plot");
  const tableView = document.getElementById("table-view");
  const tooltip = document.createElement("div");
  tooltip.className = "tooltip";
  tooltip.setAttribute("role", "status");

  function render() {
    const bars = DIMS[barsId], bands = DIMS[bandsId];
    const { grid, att, order } = crosstab(bars, bands);
    const colors = bandColors(bands);
    const stack = stackOrder(bands);

    const nBars = order.length;
    const PLOT_W = Math.max(BASE_PLOT_W, MIN_SLOT * nBars);
    const W = M.left + M.right + PLOT_W;
    const yMax = niceMax(Math.max(...bars.counts));
    const y = (v) => M.top + PLOT_H - (v / yMax) * PLOT_H;

    const svg = el("svg", {
      viewBox: `0 0 ${W} ${H}`,
      role: "img",
      "aria-label": `Respondents by ${bars.label.toLowerCase()}, each bar split ` +
                    `by ${bands.label.toLowerCase()}`,
    });

    ticks(yMax).forEach((t) => {
      svg.appendChild(el("line", {
        class: "gridline", x1: M.left, x2: M.left + PLOT_W, y1: y(t), y2: y(t),
      }));
      const lab = el("text", {
        class: "tick-text", x: M.left - 10, y: y(t) + 4, "text-anchor": "end",
      });
      lab.textContent = fmt(t);
      svg.appendChild(lab);
    });

    const slotW = PLOT_W / nBars;
    const barW = Math.min(MAX_BAR, slotW * 0.62);

    order.forEach((bi, k) => {
      const total = bars.counts[bi];
      const cx = M.left + slotW * (k + 0.5);
      const x = cx - barW / 2;
      const g = el("g", { class: "slot" });

      g.appendChild(el("rect", {
        class: "hit", x: M.left + slotW * k + 1, y: M.top,
        width: slotW - 2, height: PLOT_H, rx: 4,
      }));

      // Stack upward from the baseline.
      let acc = 0;
      const drawn = [];
      stack.forEach((si) => {
        const v = grid[bi][si];
        if (!v) return;
        drawn.push(si);
        const yTop = y(acc + v);
        const hFull = (v / yMax) * PLOT_H;
        acc += v;
        const isTop = si === stack[stack.length - 1] ||
                      stack.slice(stack.indexOf(si) + 1)
                           .every((s2) => !grid[bi][s2]);
        // The gap is taken off the top of each segment so the surface does the
        // separating; no strokes on the marks.
        const h = Math.max(hFull - (isTop ? 0 : SEG_GAP), 0.6);
        const d = segPath(x, yTop + (isTop ? 0 : SEG_GAP), barW, h, isTop);
        if (d) g.appendChild(el("path", { d, fill: colors[si] }));
      });

      const tot = el("text", {
        class: "total-text", x: cx, y: y(total) - 8, "text-anchor": "middle",
      });
      tot.textContent = fmt(total);
      g.appendChild(tot);

      const maxChars = Math.max(9, Math.floor(slotW / 6.2));
      const lines = wrap(bars.labels[bi], maxChars, 4);
      const text = el("text", {
        class: "cat-text", x: cx, y: M.top + PLOT_H + 18, "text-anchor": "middle",
      });
      lines.forEach((ln, li) => {
        const ts = el("tspan", { x: cx, dy: li === 0 ? 0 : 13 });
        ts.textContent = ln;
        text.appendChild(ts);
      });
      g.appendChild(text);

      const show = () => {
        g.classList.add("is-active");
        const rows = stack.slice().reverse().filter((si) => grid[bi][si])
          .map((si) => {
            const v = grid[bi][si];
            const sw = colors[si].startsWith("var(")
              ? `background:${colors[si]}` : `background:${colors[si]}`;
            return `<div class="tt-row"><span class="tt-key">` +
              `<i class="swatch" style="${sw}"></i>${bands.categories[si]}</span>` +
              `<b>${fmt(v)} · ${pct(v, total)}</b></div>`;
          }).join("");
        const attTotal = att[bi].reduce((s, v) => s + v, 0);
        tooltip.innerHTML =
          `<div class="tt-title">${bars.categories[bi]} — ${fmt(total)} people</div>` +
          rows +
          `<div class="tt-row tt-total"><span class="tt-key">Attended Phase 2</span>` +
          `<b>${fmt(attTotal)}</b></div>`;
        tooltip.dataset.show = "1";

        const rect = plot.getBoundingClientRect();
        const scale = rect.width / W;
        const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
        const anchorY = y(total) * scale;
        tooltip.style.left = Math.min(Math.max(cx * scale, tw / 2 + 2),
                                      rect.width - tw / 2 - 2) + "px";
        tooltip.style.top =
          (anchorY - th - 14 >= 0 ? anchorY - th - 14 : anchorY + 14) + "px";
        tooltip.style.transform = "translateX(-50%)";
      };
      const hide = () => {
        g.classList.remove("is-active");
        tooltip.dataset.show = "0";
      };
      g.addEventListener("pointerenter", show);
      g.addEventListener("pointermove", show);
      g.addEventListener("pointerleave", hide);
      svg.appendChild(g);
    });

    plot.replaceChildren(svg, tooltip);
    renderKey(bands, colors, stack);
    renderTable(bars, bands, grid, order, stack, colors);
    renderNotes(bars, bands);
  }

  function renderKey(bands, colors, stack) {
    const root = document.getElementById("key");
    const mode = colorMode(bands);
    root.querySelector("h3").textContent = bands.label;
    root.querySelector("p").textContent = mode === "sequential"
      ? "Bands run darkest at the base to lightest at the top."
      : mode === "diverging"
      ? "Positive and negative are opposite hues; neutral and mixed sit between them."
      : "One colour per group; the order carries no ranking.";
    // Top of the stack first, so reading the key top-to-bottom matches
    // reading a bar top-to-bottom.
    const items = stack.slice().reverse();
    root.querySelector("ul").replaceChildren(...items.map((si) => {
      const li = document.createElement("li");
      if (!bands.counts[si]) li.className = "is-zero";
      const sw = document.createElement("i");
      sw.className = "swatch";
      sw.style.background = colors[si];
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = bands.labels[si];
      name.title = bands.categories[si];
      const c = document.createElement("span");
      c.className = "count";
      c.textContent = fmt(bands.counts[si]);
      li.append(sw, name, c);
      return li;
    }));
  }

  function renderTable(bars, bands, grid, order, stack, colors) {
    const cols = stack.slice().reverse();
    const table = document.createElement("table");
    const cap = document.createElement("caption");
    cap.textContent = `${bars.label} by ${bands.label} — people`;
    table.appendChild(cap);

    const thead = document.createElement("thead");
    thead.innerHTML = `<tr><th scope="col">${bars.label}</th>` +
      cols.map((si) => `<th scope="col">${bands.labels[si]}</th>`).join("") +
      `<th scope="col">Total</th></tr>`;
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    order.forEach((bi) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<th scope="row">${bars.categories[bi]}</th>` +
        cols.map((si) => `<td>${grid[bi][si] ? fmt(grid[bi][si]) : "—"}</td>`).join("") +
        `<td>${fmt(bars.counts[bi])}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    const tfoot = document.createElement("tfoot");
    tfoot.innerHTML = `<tr><th scope="row">All respondents</th>` +
      cols.map((si) => `<td>${fmt(bands.counts[si])}</td>`).join("") +
      `<td>${fmt(N)}</td></tr>`;
    table.appendChild(tfoot);

    tableView.replaceChildren(table);
  }

  function renderNotes(bars, bands) {
    const prov = DATA.provenance;
    const bns = bars.counts[bars.notStatedIndex];
    const sns = bands.counts[bands.notStatedIndex];
    const items = [
      `Bar heights are people, not shares — so a short bar is a small group, ` +
      `and the bands inside it are that group's split.`,
      `Bars run tallest first, with “${DATA.notStated}” parked at the right ` +
      `regardless of size. Inside each bar, “${DATA.notStated}” is the grey ` +
      `band at the bottom.`,
      // Only worth saying when somebody actually declined.
      ...(sns || bns ? [
        (sns ? `${fmt(sns)} of ${fmt(N)} people didn't give ${article(bands.label)}` : "")
        + (sns && bns ? ", and " : "")
        + (bns ? `${fmt(bns)} didn't give ${article(bars.label)}` : "")
        + `. Those are shown, not dropped, so every bar still totals its real `
        + `headcount.`,
      ] : []),
      `${fmt(N)} respondents from <code>${prov.source}</code>` +
      (prov.blankId || prov.duplicateRows
        ? `: ${fmt(prov.rows)} rows, less ${prov.blankId} with a blank ` +
          `respondent id (empty in every column) and ${prov.duplicateRows} ` +
          `duplicate row.`
        : ` — one row each, no blank ids or duplicates to drop.`),
    ];
    const mode = colorMode(bands);
    if (mode === "diverging") {
      items.push(`${bands.label} is coloured as a diverging scale — positive ` +
        `and negative are opposite hues, with neutral and mixed shown as ` +
        `separate in-between categories rather than blended.`);
    } else if (mode === "categorical") {
      items.push(`${bands.label} has no natural order, so the bands use ` +
        `separate colours rather than a light-to-dark ramp — nothing is implied ` +
        `by which sits higher.`);
    }
    document.getElementById("notes-list").innerHTML =
      items.map((t) => `<li>${t}</li>`).join("");
  }

  // --- pulldowns -----------------------------------------------------------
  const barsSel = document.getElementById("bars");
  const bandsSel = document.getElementById("bands");

  function fillSelects() {
    const order = DATA.dimensionOrder;
    barsSel.replaceChildren(...order
      .filter((id) => DIMS[id].channels.includes("wedge"))
      .map((id) => {
        const o = document.createElement("option");
        o.value = id; o.textContent = DIMS[id].label;
        o.selected = id === barsId;
        return o;
      }));
    // Splitting a group by itself would give every bar a single band.
    const bandIds = order.filter((id) =>
      DIMS[id].channels.includes("shade") && id !== barsId);
    if (!bandIds.includes(bandsId)) bandsId = bandIds[0];
    bandsSel.replaceChildren(...bandIds.map((id) => {
      const o = document.createElement("option");
      o.value = id; o.textContent = DIMS[id].label;
      o.selected = id === bandsId;
      return o;
    }));
  }

  barsSel.addEventListener("change", () => {
    barsId = barsSel.value; fillSelects(); render();
  });
  bandsSel.addEventListener("change", () => {
    bandsId = bandsSel.value; render();
  });

  const btnChart = document.getElementById("view-chart");
  const btnTable = document.getElementById("view-table");
  function setView(chart) {
    showChart = chart;
    btnChart.setAttribute("aria-pressed", String(chart));
    btnTable.setAttribute("aria-pressed", String(!chart));
    plot.hidden = !chart;
    tableView.hidden = chart;
  }
  btnChart.addEventListener("click", () => setView(true));
  btnTable.addEventListener("click", () => setView(false));

  // --- theme ---------------------------------------------------------------
  const themeButtons = [...document.querySelectorAll("[data-theme-choice]")];
  const osDark = window.matchMedia("(prefers-color-scheme: dark)");
  const root = document.documentElement;
  function applyTheme(pref) {
    root.dataset.theme = pref;
    root.dataset.themeResolved =
      pref === "auto" ? (osDark.matches ? "dark" : "light") : pref;
    themeButtons.forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.themeChoice === pref)));
    try { localStorage.setItem("theme", pref); } catch (e) {}
  }
  themeButtons.forEach((b) =>
    b.addEventListener("click", () => applyTheme(b.dataset.themeChoice)));
  osDark.addEventListener("change", () => {
    if (root.dataset.theme === "auto") applyTheme("auto");
  });
  applyTheme(root.dataset.theme || "auto");

  fillSelects();
  setView(true);
  render();
  window.addEventListener("resize", () => (tooltip.dataset.show = "0"));
})();
</script>
</body>
</html>
