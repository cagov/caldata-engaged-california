<style>
  :root {
    --surface: #ffffff;
    --surface-sunken: #f4f4f4;
    --ink: #1f2225;
    --ink-secondary: #4c5257;
    --ink-muted: #6e757b;
    --border: #d9dad6;
    --focus: #2E6C8A;
    color-scheme: light;
  }
  :root[data-theme-resolved="dark"] {
    --surface: #1a1a19;
    --surface-sunken: #232322;
    --ink: #f1f1ef;
    --ink-secondary: #c3c5c2;
    --ink-muted: #9a9d99;
    --border: #3a3a38;
    --focus: #74BCDD;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 15px/1.5 "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1320px; margin: 0 auto; padding: 40px 32px 64px; }

  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 24px; color: var(--ink-secondary); max-width: 80ch; }

  /* --- controls --------------------------------------------------------- */
  .controls {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px;
    margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-muted);
  }
  .select-wrap { position: relative; }
  select {
    appearance: none;
    font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1.2;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px 52px 14px 18px;
    min-width: 250px;
    box-shadow: 0 4px 10px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.07);
    cursor: pointer;
  }
  select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .select-wrap svg {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--focus);
  }

  .toggle {
    margin-left: auto; display: inline-flex; gap: 2px; padding: 3px;
    background: var(--surface-sunken); border-radius: 10px;
  }
  .toggle button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--ink-secondary);
    background: none; border: 0; border-radius: 8px;
    padding: 9px 14px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .toggle button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* --- tab strip -------------------------------------------------------- */
  .tabrow {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;
    border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--ink-muted);
    background: none; border: 0;
    border-bottom: 3px solid transparent;
    padding: 12px 16px; margin-bottom: -1px; cursor: pointer;
  }
  .tabs button:hover { color: var(--ink-secondary); }
  .tabs button[aria-selected="true"] {
    color: var(--ink); border-bottom-color: var(--focus);
  }
  .tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }

  /* --- layout ----------------------------------------------------------- */
  .figure {
    display: grid; grid-template-columns: minmax(0, 1fr) 290px;
    gap: 36px; align-items: start;
  }
  @media (max-width: 940px) { .figure { grid-template-columns: 1fr; } }

  .headline {
    margin: 0 0 8px; font-size: 15px; color: var(--ink-secondary);
  }
  .headline b { color: var(--ink); }

  .plot { position: relative; }
  .plot svg { display: block; width: 100%; height: auto; }
  .dot { stroke: none; }
  .dot-attendee { stroke: var(--surface); stroke-width: 1.5; }
  .dot.is-active { stroke: var(--surface); stroke-width: 2.5; }
  .sector-label { font-size: 12.5px; font-weight: 600; fill: var(--ink-secondary); }
  .sector-count { font-size: 11px; fill: var(--ink-muted); }
  .sector-tick { stroke: var(--border); stroke-width: 1; }

  .tooltip {
    position: absolute; z-index: 5; pointer-events: none; opacity: 0;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; width: max-content; max-width: 300px;
    box-shadow: 0 6px 20px rgba(0,0,0,.13);
    font-size: 13px; transition: opacity .08s ease;
  }
  .tooltip[data-show="1"] { opacity: 1; }
  .tooltip .tt-row {
    display: flex; gap: 18px; justify-content: space-between;
    white-space: nowrap; line-height: 1.6;
  }
  .tooltip .tt-row span:first-child { color: var(--ink-muted); }
  .tooltip .tt-row b { font-weight: 600; }
  .tooltip .tt-status {
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
  }
  .tooltip .tt-swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 7px; vertical-align: -1px;
  }

  /* --- legends ---------------------------------------------------------- */
  .key { margin-bottom: 26px; }
  .key h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-muted); margin: 0 0 8px;
  }
  .key p { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-muted); }
  .key ul { list-style: none; margin: 0; padding: 0; }
  .key li {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--ink-secondary); padding: 2.5px 0;
  }
  .key .dotkey { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .key .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .key .count {
    margin-left: auto; color: var(--ink-muted);
    font-variant-numeric: tabular-nums; flex: none;
  }
  .key li.is-zero { opacity: .5; }
  .caveat {
    margin: 0 0 10px; font-size: 12.5px; color: var(--ink-secondary);
    border-left: 3px solid var(--border); padding-left: 10px;
  }

  .notes { margin-top: 36px; font-size: 13px; color: var(--ink-muted); max-width: 92ch; }
  .notes h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); margin: 0 0 8px; }
  .notes ul { margin: 0; padding-left: 20px; }
  .notes li { margin-bottom: 5px; }
</style>

<script>
(function () {
  const DATA = window.RING_DATA;
  const DIMS = DATA.dimensions;

  const VIEW_W = 1160, VIEW_H = 880;
  const CX = VIEW_W / 2, CY = VIEW_H / 2;
  const R_INNER = 168;
  const R_OUTER = 352;
  const DOT_R = 3.2;            // 3,299 dots over this annulus
  const DOT_R_ATTENDEE = 4.6;
  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));  // ~137.508 degrees
  const BASE_CHROMA = 0.135;
  const MUTED_CHROMA_SCALE = 0.06;
  const MUTED_LIGHTNESS = 0.90;
  const SNAP = 9;               // hover snap radius, viewBox units
  const LABEL_MIN_DEG = 9;      // below this a wedge can't hold a label

  const BASE36 = "0123456789abcdefghijklmnopqrstuvwxyz";
  const decode = (str) => [...str].map((ch) => BASE36.indexOf(ch));

  // --- OKLCH -> sRGB hex, with a chroma walk-down to stay in gamut ---------
  function oklabToLinear(L, a, b) {
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
    return [
      +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
    ];
  }
  const inGamut = (rgb) => rgb.every((c) => c >= -0.0005 && c <= 1.0005);
  function encode(c) {
    const v = Math.max(0, Math.min(1, c));
    const s = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
    return Math.round(s * 255).toString(16).padStart(2, "0");
  }
  const colorCache = new Map();
  function oklch(L, C, hDeg) {
    const cacheKey = `${L}|${C}|${hDeg}`;
    if (colorCache.has(cacheKey)) return colorCache.get(cacheKey);
    const h = (hDeg * Math.PI) / 180;
    let c = C, rgb;
    // Saturated hues leave sRGB at extreme lightness; back the chroma off
    // until the colour is representable rather than letting it clip.
    for (let i = 0; i < 40; i++) {
      rgb = oklabToLinear(L, c * Math.cos(h), c * Math.sin(h));
      if (inGamut(rgb)) break;
      c *= 0.92;
    }
    const hex = "#" + rgb.map(encode).join("");
    colorCache.set(cacheKey, hex);
    return hex;
  }

  // --- per-respondent data -------------------------------------------------
  const N = DATA.total;
  const attended = decode(DATA.attended);
  const invited = decode(DATA.invited);
  const codes = {};
  Object.values(DIMS).forEach((d) => (codes[d.id] = decode(d.codes)));

  // --- slot lattice --------------------------------------------------------
  // Golden-angle spiral across the annulus. The sqrt makes radial spacing
  // equal-area, which is what keeps neighbouring dots about the same distance
  // apart everywhere. Built once — it never depends on the selection.
  const slots = [];
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N;
    const r = Math.sqrt(R_INNER * R_INNER +
                        (R_OUTER * R_OUTER - R_INNER * R_INNER) * t);
    let theta = (i * GOLDEN_ANGLE) % (2 * Math.PI);
    if (theta < 0) theta += 2 * Math.PI;
    slots.push({ r, theta });
  }
  slots.sort((a, b) => a.theta - b.theta);

  // --- state ---------------------------------------------------------------
  const VIEWS = [
    { id: "all", label: "All respondents" },
    { id: "attendees", label: "Phase 2 attendees" },
  ];
  let wedgeId = DATA.defaultWedge;
  let shadeId = DATA.defaultShade;
  let viewId = VIEWS[0].id;

  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    return n;
  };

  const plot = document.getElementById("plot");
  const tooltip = document.createElement("div");
  tooltip.className = "tooltip";
  tooltip.setAttribute("role", "status");

  // --- assignment ----------------------------------------------------------
  // Wedges are handed out by angle in category order, so each category owns
  // one contiguous wedge sized by headcount. Within a wedge the outermost
  // slots take the first shade category, filling inwards.
  function layout(wedge, shade) {
    const wCodes = codes[wedge.id], sCodes = codes[shade.id];

    const byWedge = wedge.categories.map(() => []);
    for (let p = 0; p < N; p++) byWedge[wCodes[p]].push(p);

    const dots = new Array(N);
    const sectors = [];
    let cursor = 0;

    byWedge.forEach((people, wi) => {
      if (!people.length) return;
      const mine = slots.slice(cursor, cursor + people.length);
      cursor += people.length;

      sectors.push({
        wedgeIndex: wi,
        count: people.length,
        thetaStart: mine[0].theta,
        thetaEnd: mine[mine.length - 1].theta,
      });

      // Order this wedge's people by shade band, then hand them the wedge's
      // slots from the rim inwards.
      people.sort((a, b) => sCodes[a] - sCodes[b]);
      const byRadius = [...mine].sort((a, b) => b.r - a.r);
      people.forEach((p, k) => {
        const slot = byRadius[k];
        dots[p] = {
          x: CX + slot.r * Math.cos(slot.theta),
          y: CY + slot.r * Math.sin(slot.theta),
          w: wi,
          s: sCodes[p],
        };
      });
    });

    return { dots, sectors };
  }

  // --- render --------------------------------------------------------------
  let current = null;   // { dots, sectors, nodes, wedge, shade, order }

  function render() {
    const wedge = DIMS[wedgeId], shade = DIMS[shadeId];
    const highlight = viewId === "attendees";
    const { dots, sectors } = layout(wedge, shade);

    const svg = el("svg", {
      viewBox: `0 0 ${VIEW_W} ${VIEW_H}`,
      role: "img",
      "aria-label": `${N} survey respondents as dots, in wedges by ` +
        `${wedge.label.toLowerCase()} and shaded by ${shade.label.toLowerCase()}`,
    });

    // Wedge labels outside the rim. A wedge too narrow to hold text is left to
    // the legend and the hover readout; alternating radii keep neighbours from
    // colliding.
    let placed = 0;
    sectors.forEach(({ wedgeIndex, count, thetaStart, thetaEnd }) => {
      const spanDeg = ((thetaEnd - thetaStart) * 180) / Math.PI;
      const mid = (thetaStart + thetaEnd) / 2;
      if (spanDeg < LABEL_MIN_DEG) {
        // Still mark where the wedge is, so a reader can find it.
        svg.appendChild(el("line", {
          class: "sector-tick",
          x1: CX + (R_OUTER + 6) * Math.cos(mid),
          y1: CY + (R_OUTER + 6) * Math.sin(mid),
          x2: CX + (R_OUTER + 16) * Math.cos(mid),
          y2: CY + (R_OUTER + 16) * Math.sin(mid),
        }));
        return;
      }
      const rLabel = R_OUTER + (placed++ % 2 ? 58 : 26);
      const x = CX + rLabel * Math.cos(mid);
      const y = CY + rLabel * Math.sin(mid);
      const cos = Math.cos(mid);
      const anchor = Math.abs(cos) < 0.25 ? "middle" : cos > 0 ? "start" : "end";
      const name = el("text", {
        class: "sector-label", x, y, "text-anchor": anchor,
        "dominant-baseline": "middle",
      });
      name.textContent = wedge.labels[wedgeIndex];
      const sub = el("text", {
        class: "sector-count", x, y: y + 15, "text-anchor": anchor,
        "dominant-baseline": "middle",
      });
      sub.textContent = highlight
        ? `${wedge.attendedCounts[wedgeIndex]} of ${count}`
        : count.toLocaleString();
      svg.append(name, sub);
    });

    // Colour: wedge category picks the hue, shade category picks the
    // lightness. Not stated sits off the ramp at near-zero chroma.
    const fillFor = (d) => {
      // Near-neutral if EITHER channel has no value, so a not-stated wedge
      // reads as "no value" the same way a not-stated band does — and matches
      // its own legend swatch.
      const neutral = d.s === shade.notStatedIndex ||
                      d.w === wedge.notStatedIndex;
      const chroma = BASE_CHROMA * (neutral ? DATA.notStatedChromaScale : 1);
      return oklch(shade.lightness[d.s], chroma, wedge.hues[d.w]);
    };
    const mutedFor = (d) => oklch(
      MUTED_LIGHTNESS, BASE_CHROMA * MUTED_CHROMA_SCALE, wedge.hues[d.w]);

    // Attendees are drawn after everyone else so they sit on top.
    const order = highlight
      ? [...dots.keys()].sort((a, b) => attended[a] - attended[b])
      : [...dots.keys()];

    const layer = el("g", {});
    const nodes = new Array(N);
    order.forEach((p) => {
      const d = dots[p];
      const isAttendee = attended[p] === 1;
      const muted = highlight && !isAttendee;
      const c = el("circle", {
        class: "dot" + (highlight && isAttendee ? " dot-attendee" : ""),
        cx: d.x.toFixed(1), cy: d.y.toFixed(1),
        r: highlight && isAttendee ? DOT_R_ATTENDEE : DOT_R,
        fill: muted ? mutedFor(d) : fillFor(d),
      });
      layer.appendChild(c);
      nodes[p] = c;
    });
    svg.appendChild(layer);

    plot.replaceChildren(svg, tooltip);
    tooltip.dataset.show = "0";
    current = { dots, sectors, nodes, wedge, shade, highlight, svg,
                fillFor, mutedFor };
    attachHover();

    renderHeadline();
    renderLegends();
    renderNotes();
  }

  // --- hover ---------------------------------------------------------------
  // A 3.2px dot is a miserable hit target, so hover snaps to the nearest dot
  // rather than requiring a direct hit. Brute-force nearest over 3,299 points
  // is cheap at pointer rates.
  let active = null, activeIndex = -1;
  function hideTip() {
    if (active) active.classList.remove("is-active");
    active = null;
    activeIndex = -1;
    tooltip.dataset.show = "0";
  }
  function nearest(vx, vy) {
    const { dots } = current;
    let best = -1, bestD = SNAP * SNAP;
    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      if (!d) continue;
      const dx = d.x - vx, dy = d.y - vy;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD) { bestD = d2; best = i; }
    }
    return best;
  }
  function attachHover() {
    active = null;
    activeIndex = -1;
    current.svg.addEventListener("pointermove", (ev) => {
      const rect = plot.getBoundingClientRect();
      const scale = rect.width / VIEW_W;
      const p = nearest((ev.clientX - rect.left) / scale,
                        (ev.clientY - rect.top) / scale);
      if (p < 0) { hideTip(); return; }
      if (p !== activeIndex) {
        if (active) active.classList.remove("is-active");
        activeIndex = p;
        active = current.nodes[p];
        active.classList.add("is-active");
        const { dots, wedge, shade, highlight, fillFor, mutedFor } = current;
        const d = dots[p];
        const swatch = highlight && attended[p] !== 1
          ? mutedFor(d) : fillFor(d);
        const status = attended[p] ? "Attended a session"
          : invited[p] ? "Invited, did not attend"
          : "Not invited";
        tooltip.innerHTML =
          `<div class="tt-row"><span>${wedge.label}</span>` +
          `<b><i class="tt-swatch" style="background:${swatch}"></i>` +
          `${wedge.categories[d.w]}</b></div>` +
          `<div class="tt-row"><span>${shade.label}</span>` +
          `<b>${shade.categories[d.s]}</b></div>` +
          `<div class="tt-row tt-status"><span>Phase 2</span>` +
          `<b>${status}</b></div>`;
      }
      const rect2 = plot.getBoundingClientRect();
      const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
      const px = ev.clientX - rect2.left, py = ev.clientY - rect2.top;
      tooltip.style.left =
        Math.min(Math.max(px, tw / 2 + 2), rect2.width - tw / 2 - 2) + "px";
      tooltip.style.top = (py - th - 14 >= 0 ? py - th - 14 : py + 18) + "px";
      tooltip.style.transform = "translateX(-50%)";
      tooltip.dataset.show = "1";
    });
    current.svg.addEventListener("pointerleave", hideTip);
  }

  // --- chrome --------------------------------------------------------------
  function renderHeadline() {
    const { highlight } = current;
    const pct = (DATA.attendedTotal / N * 100).toFixed(1);
    document.getElementById("headline").innerHTML = highlight
      ? `<b>${DATA.attendedTotal}</b> of ${N.toLocaleString()} respondents ` +
        `(${pct}%) attended a Phase 2 session. ` +
        `${DATA.invitedTotal.toLocaleString()} were invited.`
      : `<b>${N.toLocaleString()}</b> survey respondents, one dot each.`;
  }

  function legendInto(id, title, blurb, items, caveat) {
    const root = document.getElementById(id);
    root.querySelector("h3").textContent = title;
    const p = root.querySelector("p");
    p.textContent = blurb;
    root.querySelectorAll(".caveat").forEach((n) => n.remove());
    if (caveat) {
      const c = document.createElement("p");
      c.className = "caveat";
      c.textContent = caveat;
      p.after(c);
    }
    root.querySelector("ul").replaceChildren(...items.map((it) => {
      const li = document.createElement("li");
      if (!it.count) li.className = "is-zero";
      const sw = document.createElement("i");
      sw.className = "dotkey";
      sw.style.background = it.color;
      if (it.outline) sw.style.border = "1px solid var(--border)";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = it.label;
      name.title = it.label;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = it.countLabel;
      li.append(sw, name, count);
      return li;
    }));
  }

  function renderLegends() {
    const { wedge, shade, highlight } = current;

    // Wedge key: hue per category, at a mid lightness so the swatch reads as
    // that category's hue rather than one shade band.
    legendInto("key-wedge", `${wedge.label} — wedge`,
      "Each category holds one wedge, sized by its share of respondents.",
      wedge.categories.map((cat, i) => ({
        label: wedge.labels[i],
        color: oklch(0.58, BASE_CHROMA *
          (i === wedge.notStatedIndex ? DATA.notStatedChromaScale : 1),
          wedge.hues[i]),
        count: wedge.counts[i],
        countLabel: highlight
          ? `${wedge.attendedCounts[i]} / ${wedge.counts[i].toLocaleString()}`
          : wedge.counts[i].toLocaleString(),
      })),
      highlight ? "Counts are attendees / all respondents." : null);

    // Shade key: near-neutral chroma so a swatch reads as a lightness step and
    // not as one particular wedge's hue.
    legendInto("key-shade", `${shade.label} — shading`,
      "Lightest on the outer rim, darkest toward the centre, within every wedge.",
      shade.categories.map((cat, i) => ({
        label: shade.labels[i],
        color: oklch(shade.lightness[i], 0.02 *
          (i === shade.notStatedIndex ? DATA.notStatedChromaScale : 1), 250),
        outline: true,
        count: shade.counts[i],
        countLabel: highlight
          ? `${shade.attendedCounts[i]} / ${shade.counts[i].toLocaleString()}`
          : shade.counts[i].toLocaleString(),
      })),
      shade.ordinal ? null
        : `${shade.label} has no natural order, but lightness implies one. ` +
          `Read the bands as groups, not as a scale.`);
  }

  function renderNotes() {
    const { wedge, shade, highlight } = current;
    const prov = DATA.provenance;
    const wns = wedge.counts[wedge.notStatedIndex];
    const sns = shade.counts[shade.notStatedIndex];
    const hidden = current.sectors.filter(({ thetaStart, thetaEnd }) =>
      ((thetaEnd - thetaStart) * 180) / Math.PI < LABEL_MIN_DEG).length;

    const items = [
      `${N.toLocaleString()} respondents from <code>${prov.source}</code>: ` +
      `${prov.rows.toLocaleString()} rows, less ${prov.blankId} with a blank ` +
      `respondent id (those rows are empty in every column) and ` +
      `${prov.duplicateRows} duplicate row for a respondent already counted.`,
      `Dot positions come from a golden-angle (${(GOLDEN_ANGLE * 180 / Math.PI).toFixed(3)}°) ` +
      `spiral over the annulus, with radius spaced by area so packing density ` +
      `is even from rim to centre. The lattice sets the spacing; the two ` +
      `pulldowns set which dot goes where.`,
      `“${DATA.notStated}” is not a step on the shading ramp — those dots sit ` +
      `near-neutral at the inner edge so they aren't read as a value. ` +
      `Currently ${wns.toLocaleString()} for ${wedge.label.toLowerCase()} and ` +
      `${sns.toLocaleString()} for ${shade.label.toLowerCase()}.`,
    ];
    if (shade.ordinal && shade.id === "role") {
      items.push(`Role at work is ordered rim-to-centre by rising seniority ` +
        `and ownership. That ordering is editorial, not inherent to the data.`);
    }
    if (hidden) {
      items.push(`${hidden} wedge${hidden > 1 ? "s are" : " is"} too narrow ` +
        `to carry a label and ${hidden > 1 ? "are" : "is"} marked with a tick ` +
        `instead; use the key or hover to identify ${hidden > 1 ? "them" : "it"}.`);
    }
    items.push(highlight
      ? `Attendees keep full colour and a larger dot; everyone else is muted to ` +
        `pale neutral. Raising attendee lightness instead would have made them ` +
        `the faintest dots on the page.`
      : `The Phase 2 attendees tab keeps these same positions and picks out the ` +
        `${DATA.attendedTotal} people who attended.`);
    items.push(`Only dimensions with ${DATA.maxShadeCategories} or fewer ` +
      `categories can drive the shading, since lightness supports about that ` +
      `many distinguishable steps. Wider dimensions are wedge-only.`);

    document.getElementById("notes-list").innerHTML =
      items.map((t) => `<li>${t}</li>`).join("");
  }

  // --- pulldowns & tabs ----------------------------------------------------
  const wedgeSel = document.getElementById("wedge");
  const shadeSel = document.getElementById("shade");

  function fillSelects() {
    const order = DATA.dimensionOrder;
    wedgeSel.replaceChildren(...order
      .filter((id) => DIMS[id].channels.includes("wedge"))
      .map((id) => {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = DIMS[id].label;
        o.selected = id === wedgeId;
        return o;
      }));
    // Exclude the wedge dimension: shading a wedge by itself would make every
    // wedge a single band.
    const shadeIds = order.filter((id) =>
      DIMS[id].channels.includes("shade") && id !== wedgeId);
    if (!shadeIds.includes(shadeId)) shadeId = shadeIds[0];
    shadeSel.replaceChildren(...shadeIds.map((id) => {
      const o = document.createElement("option");
      o.value = id;
      o.textContent = DIMS[id].label;
      o.selected = id === shadeId;
      return o;
    }));
  }

  wedgeSel.addEventListener("change", () => {
    wedgeId = wedgeSel.value;
    fillSelects();
    render();
  });
  shadeSel.addEventListener("change", () => {
    shadeId = shadeSel.value;
    render();
  });

  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...VIEWS.map((v) => {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.dataset.view = v.id;
    b.textContent = v.label;
    b.setAttribute("aria-selected", String(v.id === viewId));
    b.addEventListener("click", () => {
      viewId = v.id;
      [...tabs.children].forEach((n) =>
        n.setAttribute("aria-selected", String(n.dataset.view === viewId)));
      render();
    });
    return b;
  }));

  // --- theme ---------------------------------------------------------------
  const themeButtons = [...document.querySelectorAll("[data-theme-choice]")];
  const osDark = window.matchMedia("(prefers-color-scheme: dark)");
  const root = document.documentElement;
  function applyTheme(pref) {
    root.dataset.theme = pref;
    root.dataset.themeResolved =
      pref === "auto" ? (osDark.matches ? "dark" : "light") : pref;
    themeButtons.forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.themeChoice === pref)));
    try { localStorage.setItem("theme", pref); } catch (e) {}
  }
  themeButtons.forEach((b) =>
    b.addEventListener("click", () => applyTheme(b.dataset.themeChoice)));
  osDark.addEventListener("change", () => {
    if (root.dataset.theme === "auto") applyTheme("auto");
  });
  applyTheme(root.dataset.theme || "auto");

  fillSelects();
  render();
  window.addEventListener("resize", hideTip);
})();
</script>
</body>
</html>
