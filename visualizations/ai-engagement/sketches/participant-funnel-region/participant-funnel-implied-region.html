<meta charset="utf-8">
<title>Phase 1 to 14 conversations — implied funnel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&family=Noto+Sans:wght@400;600&family=Noto+Serif:wght@700&display=swap');

:root{ --ink:#1E1E1E; --gray:#444444; --line:#DEDEE1; --blue:#0D4F8C; }
*{box-sizing:border-box}
body{
  margin:0;padding:28px 20px 48px;background:#fff;color:var(--ink);
  font-family:'Noto Sans',Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
#stage{width:100%;max-width:1040px}
canvas{width:100%;height:auto;display:block}
.controls{
  width:100%;max-width:1040px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding-top:14px;border-top:1px solid var(--line);
}
button{
  font-family:'Noto Sans Mono',ui-monospace,monospace;
  font-size:12px;letter-spacing:.04em;color:var(--gray);
  background:transparent;border:1px solid var(--line);border-radius:2px;
  padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s;
}
button:hover{color:var(--blue);border-color:var(--blue)}
button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.spacer{flex:1}
.hint{width:100%;max-width:1040px;font-size:12.5px;line-height:1.55;color:var(--gray)}
.hint code{font-family:'Noto Sans Mono',ui-monospace,monospace;font-size:12px;color:var(--blue)}
@media (max-width:640px){.spacer{display:none}}
</style>

<div id="stage"><canvas id="c" width="1040" height="812"
  aria-label="Animation showing a drifting cloud of 2,700 phase one participants pouring downward, where most stream away and 103 settle into a tapering pile that forms the shape of a funnel, then separate into 14 conversation groups arranged in a ring."></canvas></div>

<div class="controls">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <div class="spacer"></div>
  <button class="jump" data-s="0">1 · Phase 1</button>
  <button class="jump" data-s="1">2 · Phase 2</button>
  <button class="jump" data-s="2">3 · Conversations</button>
  <button id="loop" aria-pressed="true">Loop</button>
</div>

<p class="hint">Implied-funnel variant — nothing is drawn; the shape comes from how the dots move and settle. Edit <code>CONFIG.groups</code> for the real per-conversation counts and <code>CONFIG.palette</code> for brand colors. Space plays or pauses; arrow keys step between stages.</p>

<script>
const REGIONS = [
  { name:"Los Angeles", short:"Los Angeles", color:'#0D4F8C', survey:712, attend:24 },
  { name:"Bay Area", short:"Bay Area", color:'#E3881B', survey:647, attend:20 },
  { name:"Southern California", short:"Southern California", color:'#634EAF', survey:442, attend:19 },
  { name:"Sacramento Valley / Sierra Foothills", short:"Sacramento Valley", color:'#E45D48', survey:418, attend:17 },
  { name:"Central Valley", short:"Central Valley", color:'#3BAA91', survey:163, attend:5 },
  { name:"Far North / North Coast", short:"Far North / North Coast", color:'#A35F0E', survey:161, attend:6 },
  { name:"Central Coast", short:"Central Coast", color:'#3D6A7F', survey:123, attend:8 },
  { name:"Sierra Region", short:"Sierra Region", color:'#058A32', survey:12, attend:2 },
  { name:"Unknown", short:"Not stated", color:'#72717C', survey:24, attend:2 },
];

// 14 conversations, each as a count per region in REGIONS order
const SESSIONS = [
  { date:'2026-07-15', mix:[3, 1, 2, 2, 0, 1, 2, 0, 1] },  // 12
  { date:'2026-07-30', mix:[5, 3, 2, 1, 0, 0, 1, 0, 0] },  // 12
  { date:'2026-07-16', mix:[3, 0, 3, 2, 0, 0, 2, 0, 1] },  // 11
  { date:'2026-08-04', mix:[0, 1, 3, 3, 1, 0, 0, 0, 0] },  // 8
  { date:'2026-08-05', mix:[0, 2, 1, 1, 3, 1, 0, 0, 0] },  // 8
  { date:'2026-07-20', mix:[2, 0, 1, 1, 0, 2, 1, 0, 0] },  // 7
  { date:'2026-08-06', mix:[0, 3, 1, 2, 1, 0, 0, 0, 0] },  // 7
  { date:'2026-07-22', mix:[1, 1, 2, 2, 0, 0, 1, 0, 0] },  // 7
  { date:'2026-07-09', mix:[3, 2, 0, 0, 0, 0, 0, 1, 0] },  // 6
  { date:'2026-07-17', mix:[0, 3, 0, 0, 0, 2, 0, 0, 0] },  // 5
  { date:'2026-07-19', mix:[1, 2, 1, 1, 0, 0, 0, 0, 0] },  // 5
  { date:'2026-07-25', mix:[2, 0, 2, 0, 0, 0, 0, 1, 0] },  // 5
  { date:'2026-07-28', mix:[2, 1, 0, 1, 0, 0, 1, 0, 0] },  // 5
  { date:'2026-08-12', mix:[2, 1, 1, 1, 0, 0, 0, 0, 0] },  // 5
];

/* ─────────────────────────────────────────────────────────────
   CONFIG — the only block you should need to touch
   ───────────────────────────────────────────────────────────── */
const CONFIG = {
  phase1: 2702,

  groups: SESSIONS.map(x => x.mix.reduce((a, b) => a + b, 0)),
  groupNames: [],

  accent: '#0D4F8C',      // UI chrome only — never a data category

  ink:  '#1E1E1E',
  gray: '#444444',

  dwell:      1900,
  finalDwell: 6500,
  transition: 4200,     // one unbroken move from cloud to basin
  orbitSpeed: 0.34,
  driftSpeed: 0.30,
  dotSize:    3.4       // uniform through phase 1 and the funnel
};

const NEUTRAL = '#72717C';   // palette neutral: chrome, never a data category
const PHASE2  = CONFIG.groups.reduce((a, b) => a + b, 0);
const NGROUPS = CONFIG.groups.length;

const COPY = [
  { eyebrow:'STAGE 1', title:'Phase 1',
    sub:'Everyone who took part in the opening round.',
    count:CONFIG.phase1, unit:'participants' },
  { eyebrow:'STAGE 2', title:'Phase 2',
    sub:'The group that carried through, gathered.',
    count:PHASE2, unit:'participants' },
  { eyebrow:'STAGE 3', title:'The conversations',
    sub:'Small groups of uneven size, each around a facilitator.',
    count:NGROUPS, unit:'conversations' }
];

/* ── canvas ───────────────────────────────────────────────── */
const W = 1040, H = 812;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ── geometry ─────────────────────────────────────────────── */
const CX = W / 2;
const CLOUD_Y   = 245;   // the phase 1 cloud, wider than the funnel mouth
const FUNNEL_TOP = 375, MOUTH_HW = 210;
const NECK_Y     = 468, NECK_HW  = 14, SPOUT = 22;
const CY         = 435;  // center of the conversation ring

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20250825);
function gauss(){
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}


// half-width of the funnel interior at a given height
const funnelHW = y =>
  lerp(MOUTH_HW, NECK_HW, clamp((y - FUNNEL_TOP) / (NECK_Y - FUNNEL_TOP), 0, 1));

// a point on the funnel wall, u = 0 at the mouth, 1 at the neck
const wallPoint = (side, u) =>
  [CX + side * lerp(MOUTH_HW, NECK_HW, u), lerp(FUNNEL_TOP, NECK_Y, u)];

// unit normal pointing into the funnel. Discarded dots are offset along
// this by a per-dot amount, so they ride their own parallel line rather
// than all stacking on the wall itself — a single shared line turns into
// a hard dark streak once semi-transparent dots composite over it.
function wallNormal(side){
  const dx = side * (NECK_HW - MOUTH_HW), dy = NECK_Y - FUNNEL_TOP;
  const L = Math.hypot(dx, dy);
  return [-side * dy / L, side * dx / L];
}
const WALL_BAND = 40;

// Stage 2: the 103 settle inside the funnel under gravity, resting on
// each other and on the taper. Runs once at load — deterministic, since
// it draws from the seeded RNG.
// Phase 2: the 103 jam into a round mass. Rather than gravity into a
// basin — which flattens them into a lens — each dot is pulled toward a
// center point while collisions push back, so they lock against each
// other and the disc's size and slightly faceted edge emerge from the
// packing itself. Nothing is drawn; the shape is the dots. Runs at load.
const PILE_R = 7;          // dot radius once settled in phase 2
const POOL_Y = 578;        // center of the mass, just below the neck

function settlePool(n, r){
  const MIN = 2 * r;
  const pts = [];

  // seed on a loose spiral so the solver has little to undo
  for (let i = 0; i < n; i++){
    const rr = MIN * 0.62 * Math.sqrt(i + 0.5), a = i * 2.39996323;
    pts.push({
      x: CX + Math.cos(a) * rr + (rand() - 0.5) * 1.5,
      y: POOL_Y + Math.sin(a) * rr + (rand() - 0.5) * 1.5
    });
  }

  const STEPS = 420;
  for (let step = 0; step < STEPS; step++){
    // ease the pull off near the end so the pack settles instead of grinding
    const pull = step < STEPS - 100 ? 0.03 : 0.01;
    for (const p of pts){
      p.x += (CX - p.x) * pull;
      p.y += (POOL_Y - p.y) * pull;
    }

    for (let it = 0; it < 8; it++){
      for (let i = 0; i < n; i++){
        const a = pts[i];
        for (let j = i + 1; j < n; j++){
          const b = pts[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          const d2 = dx * dx + dy * dy;
          if (d2 >= MIN * MIN) continue;
          let d;
          if (d2 < 1e-6){
            // coincident dots stay welded unless split deliberately
            dx = 0.7071; dy = -0.7071; d = 0;
          } else {
            d = Math.sqrt(d2); dx /= d; dy /= d;
          }
          const push = (MIN - d) * 0.5;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
  }
  return pts.map(p => [p.x, p.y]);
}

/* ── the cloud ────────────────────────────────────────────── */
const BLOBS = 9;
const blobs = [];
for (let i = 0; i < BLOBS; i++){
  const a = rand() * Math.PI * 2, rr = Math.sqrt(rand());
  blobs.push({
    x:  CX + Math.cos(a) * rr * 310,
    y:  CLOUD_Y + Math.sin(a) * rr * 74,
    sx: 80 + rand() * 118,
    sy: 30 + rand() * 40
  });
}

const dots = [];
for (let i = 0; i < CONFIG.phase1; i++){
  const b = blobs[i % BLOBS];
  const bx = clamp(b.x + gauss() * b.sx, 70, W - 70);
  const by = clamp(b.y + gauss() * b.sy, 150, 340);
  const side = bx < CX ? -1 : 1;
  // Two contact points on the invisible wall, each pushed inward by this
  // dot's own share of the band. The band's outer edge still traces the
  // wall, so the funnel stays legible, but no two dots share a line.
  const u   = Math.pow(rand(), 0.7);                 // most contact high up
  const u2  = Math.min(0.66, u + 0.30 + rand() * 0.30);
  const nrm = wallNormal(side);
  const off = rand();
  const band = p => {
    const cap = Math.min(WALL_BAND, Math.max(4, funnelHW(p[1]) - 8));
    return [p[0] + nrm[0] * off * cap, p[1] + nrm[1] * off * cap];
  };
  const hit    = band(wallPoint(side, u));
  const hitLow = band(wallPoint(side, u2));
  dots.push({
    cloud: {
      x: bx, y: by,
      ax: 7 + rand() * 15, ay: 5 + rand() * 11,
      fx: 0.25 + rand() * 0.55, fy: 0.2 + rand() * 0.5,
      px: rand() * Math.PI * 2, py: rand() * Math.PI * 2
    },
    hit, hitLow,
    throat: [CX + (rand() - 0.5) * 2 * NECK_HW * 0.75, NECK_Y + SPOUT],
    spill: [hitLow[0] + side * (95 + rand() * 250), H + 60 + rand() * 180],
    kept: false, group: -1, color: CONFIG.accent,
    pos: [bx, by], from: [bx, by], alpha: 0, aFrom: 0, delay: 0
  });
}

// which dots come through — fixed seed, so it's the same 103 every run
// Every phase 1 dot carries a region, in the survey's real proportions.
const regionOfDot = [];
REGIONS.forEach((r, i) => { for (let k = 0; k < r.survey; k++) regionOfDot.push(i); });
for (let i = regionOfDot.length - 1; i > 0; i--){
  const j = Math.floor(rand() * (i + 1));
  [regionOfDot[i], regionOfDot[j]] = [regionOfDot[j], regionOfDot[i]];
}
dots.forEach((d, i) => { d.region = regionOfDot[i]; d.color = REGIONS[d.region].color; });

// The 103 are not a random subset. Draw them so their region mix matches
// who actually attended, and seat each one in their real conversation.
const byRegion = REGIONS.map(() => []);
dots.forEach((d, i) => byRegion[d.region].push(i));
for (const list of byRegion){
  for (let i = list.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}
const taken = REGIONS.map(() => 0);
const roster = [];                       // one entry per attendee
SESSIONS.forEach((sess, g) => {
  sess.mix.forEach((count, ri) => {
    for (let k = 0; k < count; k++){
      const idx = byRegion[ri][taken[ri]++];
      dots[idx].kept = true;
      dots[idx].group = g;
      roster.push({ idx, g });
    }
  });
});
const keptIdx = roster.map(r => r.idx);

const pool = settlePool(PHASE2, PILE_R);

// match dots to resting spots by horizontal position, so the fan-out
// below the neck doesn't cross itself
const poolByX = pool.slice().sort((a, b) => a[0] - b[0]);
keptIdx.map(idx => ({ idx, x: dots[idx].cloud.x }))
       .sort((a, b) => a.x - b.x)
       .forEach((rec, k) => { dots[rec.idx].pool = poolByX[k]; });


/* ── conversations ────────────────────────────────────────── */
const SEAT_SPACING = 15;
function orbitRings(n){
  const single = Math.max(20, n * SEAT_SPACING / (2 * Math.PI));
  if (single <= 46) return [{ r: single, count: n, rate: 1 }];
  const inner = Math.max(3, Math.round(n * 0.35));
  const rIn = Math.max(20, inner * SEAT_SPACING / (2 * Math.PI));
  return [{ r: rIn, count: inner, rate: 1.4 },
          { r: rIn + 17, count: n - inner, rate: 1 }];
}

const clusters = CONFIG.groups.map((n, g) => {
  const rings = orbitRings(n);
  return {
    n, rings,
    rc:  Math.max(...rings.map(r => r.r)) + 7,
    ang: -Math.PI / 2 + g * (Math.PI * 2 / NGROUPS),
    name:  CONFIG.groupNames[g] || ''
  };
});

const maxRc = Math.max(...clusters.map(c => c.rc));
const RING_R = Math.min(214, Math.max(150, NGROUPS * (2 * maxRc + 24) / (2 * Math.PI)));
for (const cl of clusters){
  cl.x = CX + Math.cos(cl.ang) * RING_R;
  cl.y = CY + Math.sin(cl.ang) * RING_R;
}

// Seat each attendee in their real conversation.
clusters.forEach((cl, g) => {
  const members = roster.filter(r => r.g === g).map(r => r.idx);
  let s = 0;
  for (const ring of cl.rings){
    for (let k = 0; k < ring.count; k++, s++){
      dots[members[s]].orbit = {
        r: ring.r, rate: ring.rate,
        a0: cl.ang + Math.PI + (k / ring.count) * Math.PI * 2
      };
    }
  }
});

// Hand out phase 2 positions in ring order, so the bloom fans out cleanly
// even though conversation membership is now fixed by the data.
const __ringOrder = [];
clusters.forEach((cl, g) => roster.forEach(r => { if (r.g === g) __ringOrder.push(r.idx); }));
const __seatsByAngle = pool.map(p => {
  let a = Math.atan2(p[1] - (POOL_Y), p[0] - CX) + Math.PI / 2;
  if (a < 0) a += Math.PI * 2;
  return { p, a };
}).sort((u, v) => u.a - v.a);
__ringOrder.forEach((idx, k) => { dots[idx].pool = __seatsByAngle[k].p; });
/* ── targets ──────────────────────────────────────────────── */
let clock = 0;

function cloudPos(d){
  const c = d.cloud;
  return [c.x + Math.sin(clock * c.fx * CONFIG.driftSpeed * 3 + c.px) * c.ax,
          c.y + Math.cos(clock * c.fy * CONFIG.driftSpeed * 3 + c.py) * c.ay];
}
function orbitPos(d){
  const cl = clusters[d.group];
  const a  = d.orbit.a0 + clock * CONFIG.orbitSpeed * d.orbit.rate;
  return [cl.x + Math.cos(a) * d.orbit.r, cl.y + Math.sin(a) * d.orbit.r];
}

const S = CONFIG.dotSize;

// Color stays blue until the conversations, because that is the first
// point where color means something — which group you're in. The funnel
// does the work of showing who continues.
// The 103 never stop at the neck — they converge into it, thread through,
// and keep falling into the basin as one move. The funnel is implied by
// the pinch in the middle of this path, not by anything drawn or held.
function neckDrop(d, lt){
  const throat = d.throat;
  if (lt < 0.52){
    const k = lt / 0.52;
    return [lerp(d.from[0], throat[0], k), lerp(d.from[1], throat[1], k)];
  }
  const k = (lt - 0.52) / 0.48;
  return [lerp(throat[0], d.pool[0], k), lerp(throat[1], d.pool[1], k)];
}

function target(d, stage){
  switch (stage){
    case 0: return { p:cloudPos(d), r:S, a:0.62, c:rgb(d.color) };
    case 1: return d.kept
      ? { p:d.pool,  path:neckDrop,  r:PILE_R, a:1, c:rgb(d.color) }
      : { p:d.spill, path:wallSlide, r:S, a:0, aPow:4.2, c:rgb(d.color) };
    case 2: return d.kept
      ? { p:orbitPos(d), r:6, a:1, c:rgb(d.color) }
      : { p:d.spill,     r:S, a:0, c:rgb(d.color) };
  }
}

/* ── color ────────────────────────────────────────────────── */
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function toRGB(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
const rgbCache = new Map();
function rgb(h){
  let v = rgbCache.get(h);
  if (!v){ v = toRGB(h); rgbCache.set(h, v); }
  return v;
}
const mixColor = (A, B, t) => [lerp(A[0],B[0],t), lerp(A[1],B[1],t), lerp(A[2],B[2],t)];
const css = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;

/* ── state ────────────────────────────────────────────────── */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let stage = 0, prevStage = 0, t = 1, playing = true, looping = true, last = performance.now();
let span = 0.62;   // fraction of a transition one dot's own flight occupies

// A bezier pulls away from its control points, so it only ever clips the
// wall. With nothing drawn, the trajectory has to sit ON the line — so the
// discarded dots follow an explicit three-part path: fall to the wall,
// slide down it, then peel away. Segments stay linear in lt so the overall
// easing doesn't stutter at the joins.
function wallSlide(d, lt){
  if (lt < 0.42){
    const k = lt / 0.42;
    return [lerp(d.from[0], d.hit[0], k), lerp(d.from[1], d.hit[1], k)];
  }
  if (lt < 0.62){
    const k = (lt - 0.42) / 0.20;
    return [lerp(d.hit[0], d.hitLow[0], k), lerp(d.hit[1], d.hitLow[1], k)];
  }
  const k = (lt - 0.62) / 0.38;
  return [lerp(d.hitLow[0], d.spill[0], k), lerp(d.hitLow[1], d.spill[1], k)];
}

function place(d, g, lt){
  if (g.path){
    const p = g.path(d, lt);
    d.pos[0] = p[0]; d.pos[1] = p[1];
  } else if (g.via){
    const u = 1 - lt;
    d.pos[0] = u*u*d.from[0] + 2*u*lt*g.via[0] + lt*lt*g.p[0];
    d.pos[1] = u*u*d.from[1] + 2*u*lt*g.via[1] + lt*lt*g.p[1];
  } else {
    d.pos[0] = lerp(d.from[0], g.p[0], lt);
    d.pos[1] = lerp(d.from[1], g.p[1], lt);
  }
}

function snapTo(s){
  prevStage = stage = s; t = 1;
  for (const d of dots){
    const g = target(d, s);
    d.pos = [g.p[0], g.p[1]]; d.from = [g.p[0], g.p[1]];
    d.alpha = d.aFrom = g.a; d.r = d.rFrom = g.r;
    d.cNow = d.cFrom = g.c;
  }
}
function snapValues(){
  for (const d of dots){
    const g = target(d, stage);
    d.pos = [g.p[0], g.p[1]]; d.alpha = g.a; d.r = g.r; d.cNow = g.c;
  }
}
function goTo(s){
  if (s === stage && t >= 1) return;
  prevStage = stage; stage = s; t = reduced ? 1 : 0;
  // The pour uses short individual flights spread over a wide window, so
  // only a fraction of the 2,700 are in the air at once — otherwise they
  // pile up on the same few pixels and read as a drawn line. The ring
  // bloom wants the opposite: one long, near-unified move.
  span = s === 1 ? 0.24 : 0.62;
  for (const d of dots){
    d.from = [d.pos[0], d.pos[1]];
    d.aFrom = d.alpha; d.rFrom = d.r; d.cFrom = d.cNow;
    d.delay = s === 1
      ? (d.kept ? 0.08 + rand() * 0.62 : rand() * 0.74)
      : rand() * 0.30;
  }
  if (reduced) snapValues();
}

snapTo(0);
const dwellFor = s => s === 3 ? CONFIG.finalDwell : CONFIG.dwell;
let dwellLeft = CONFIG.dwell;

/* ── draw ─────────────────────────────────────────────────── */
const fmt = n => n.toLocaleString('en-US');
function header(){
  const from = COPY[prevStage], to = COPY[stage];
  const k = easeInOut(Math.min(1, t * 1.6));

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 1;
  ctx.font = "400 11px 'Noto Sans Mono', ui-monospace, monospace";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText((k < 0.5 ? from.eyebrow : to.eyebrow).split('').join(' '), 60, 46);

  ctx.globalAlpha = Math.abs(k - 0.5) * 2;
  ctx.font = "700 30px 'Noto Serif', Georgia, serif";
  ctx.fillStyle = CONFIG.accent;
  ctx.fillText(k < 0.5 ? from.title : to.title, 60, 82);
  ctx.font = "400 14.5px 'Noto Sans', Arial, sans-serif";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText(k < 0.5 ? from.sub : to.sub, 60, 106);
  ctx.globalAlpha = 1;

  const val = Math.round(lerp(from.count, to.count, easeInOut(t)));
  ctx.textAlign = 'right';
  ctx.font = "700 50px 'Noto Sans Mono', ui-monospace, monospace";
  ctx.fillStyle = CONFIG.ink;
  ctx.fillText(fmt(val), 980, 84);

  ctx.globalAlpha = Math.abs(k - 0.5) * 2;
  ctx.font = "400 12.5px 'Noto Sans', Arial, sans-serif";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText(k < 0.5 ? from.unit : to.unit, 980, 106);
  ctx.globalAlpha = 1;
}

function ringLabels(){
  const vis = stage === 2 ? easeInOut(Math.max(0, (t - 0.55) / 0.45)) : 0;
  if (vis <= 0.01) return;

  for (const cl of clusters){
    ctx.beginPath();
    ctx.arc(cl.x, cl.y, cl.rc + 11, 0, Math.PI * 2);
    ctx.strokeStyle = NEUTRAL;
    ctx.globalAlpha = vis * 0.28;
    ctx.lineWidth = 1;
    ctx.stroke();

    const lr = RING_R + cl.rc + 30;
    const lx = CX + Math.cos(cl.ang) * lr;
    const ly = CY + Math.sin(cl.ang) * lr;

    ctx.globalAlpha = vis;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "700 15px 'Noto Sans Mono', ui-monospace, monospace";
    ctx.fillStyle = CONFIG.ink;
    ctx.fillText(String(cl.n), lx, cl.name ? ly - 8 : ly);
    if (cl.name){
      ctx.font = "400 11px 'Noto Sans', Arial, sans-serif";
      ctx.fillStyle = CONFIG.gray;
      ctx.fillText(cl.name, lx, ly + 8);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function facilitators(){
  const vis = stage === 2 ? easeInOut(Math.max(0, (t - 0.45) / 0.55)) : 0;
  if (vis <= 0.01) return;

  ctx.globalAlpha = vis;
  for (const cl of clusters){
    ctx.beginPath(); ctx.arc(cl.x, cl.y, 11, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(cl.x, cl.y, 7.5, 0, Math.PI * 2);
    ctx.fillStyle = NEUTRAL; ctx.fill();
    ctx.beginPath(); ctx.arc(cl.x, cl.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }

  const lx = 60, ly = H - 78;
  ctx.fillStyle = CONFIG.gray;
  ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(lx + 108, ly, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(lx + 108, ly, 2.8, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = "400 12px 'Noto Sans', Arial, sans-serif";
  ctx.fillStyle = CONFIG.gray;
  ctx.fillText('Participant', lx + 12, ly);
  ctx.fillText('Facilitator', lx + 120, ly);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}


// Region legend. Colour encodes one dimension only — which region a person
// is from — so it needs naming somewhere. Nine categories is above the
// ~6 that stay reliably separable under colour blindness, so the six
// largest regions take the palette's workhorse hues and the two smallest
// take the extended ones; same-family pairs (blue/steel, gold/burnt) are
// always split across a large region and a small one.
function regionLegend(){
  ctx.font = "400 11.5px 'Noto Sans', Arial, sans-serif";
  ctx.textBaseline = 'middle';
  const SW = 9, GAP = 7, PAD = 22;
  const w = REGIONS.map(r => SW + GAP + ctx.measureText(r.short).width + PAD);

  // Balance the rows rather than greedily filling: a greedy fill puts eight
  // regions on one line and one orphan below it.
  const total = w.reduce((a, b) => a + b, 0);
  const nRows = Math.max(1, Math.ceil(total / (W - 90)));
  const target = total / nRows;
  const rows = [[]];
  let cur = 0;
  w.forEach((wd, i) => {
    if (rows.length < nRows && cur + wd / 2 > target && rows[rows.length - 1].length){
      rows.push([]); cur = 0;
    }
    rows[rows.length - 1].push(i);
    cur += wd;
  });

  let y = H - 52;
  for (const row of rows){
    let x = (W - (row.reduce((a, i) => a + w[i], 0) - PAD)) / 2;
    for (const i of row){
      ctx.beginPath();
      ctx.arc(x + SW / 2, y, SW / 2, 0, Math.PI * 2);
      ctx.fillStyle = REGIONS[i].color;
      ctx.fill();
      ctx.fillStyle = CONFIG.gray;
      ctx.textAlign = 'left';
      ctx.fillText(REGIONS[i].short, x + SW + GAP, y);
      x += w[i];
    }
    y += 21;
  }
  ctx.textBaseline = 'alphabetic';
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  header();
  ringLabels();

  for (const d of dots){
    if (d.alpha <= 0.008) continue;
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = css(d.cNow);
    ctx.beginPath();
    ctx.arc(d.pos[0], d.pos[1], d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  facilitators();
  regionLegend();
}

/* ── loop ─────────────────────────────────────────────────── */
function frame(now){
  const dt = Math.min(now - last, 50); last = now;

  if (playing){
    clock += dt / 1000;

    if (t < 1){
      t = Math.min(1, t + dt / CONFIG.transition);
      for (const d of dots){
        const g = target(d, stage);
        const lt = easeInOut(Math.max(0, Math.min(1, (t - d.delay) / span)));
        place(d, g, lt);
        d.alpha = lerp(d.aFrom, g.a, g.aPow ? Math.pow(lt, g.aPow) : lt);
        d.r     = lerp(d.rFrom, g.r, lt);
        d.cNow  = mixColor(d.cFrom, g.c, lt);
      }
      if (t >= 1) dwellLeft = dwellFor(stage);
    } else {
      dwellLeft -= dt;
      if (dwellLeft <= 0){
        if (stage < 2) goTo(stage + 1);
        else if (looping) goTo(0);
        else { playing = false; playBtn.textContent = 'Play'; }
      }
    }
  }

  // ambient motion once a stage has settled
  if (t >= 1 && (stage === 0 || stage === 2)){
    for (const d of dots){
      if (stage === 2 && !d.kept) continue;
      const p = stage === 2 ? orbitPos(d) : cloudPos(d);
      d.pos[0] = p[0]; d.pos[1] = p[1];
    }
  }

  draw();
  markButtons();
  requestAnimationFrame(frame);
}

/* ── controls ─────────────────────────────────────────────── */
const playBtn = document.getElementById('play');
const jumps = [...document.querySelectorAll('.jump')];
const loopBtn = document.getElementById('loop');

function markButtons(){
  jumps.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === stage)));
}

playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing && t >= 1 && stage === 2 && !looping) goTo(0);
};
document.getElementById('restart').onclick = () => {
  clock = 0; snapTo(0); dwellLeft = CONFIG.dwell;
  playing = true; playBtn.textContent = 'Pause';
};
jumps.forEach(b => b.onclick = () => { goTo(+b.dataset.s); dwellLeft = dwellFor(stage); });
loopBtn.onclick = () => {
  looping = !looping;
  loopBtn.setAttribute('aria-pressed', String(looping));
};

addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowRight' && stage < 2){ goTo(stage + 1); dwellLeft = dwellFor(stage); }
  if (e.key === 'ArrowLeft'  && stage > 0){ goTo(stage - 1); dwellLeft = dwellFor(stage); }
});

(document.fonts ? document.fonts.ready : Promise.resolve())
  .then(() => requestAnimationFrame(frame));
</script>
