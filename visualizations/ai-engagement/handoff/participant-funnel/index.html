    <title>Who participated — EngagedCA AI consultation</title>
    <!-- Noto Sans only — the source app also reserves Noto Sans Display and
         Public Sans for other sections; nothing here needs them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

             optional (i) tooltip, wired but unused today — see README),

                </span>

            <p class="stat-value" id="stat-value"></p>
            <p class="stat-caption" id="stat-caption"></p>
          </div>
        </div>

        <div id="stage">
          <canvas id="funnel-canvas" width="1040" height="636"></canvas>

          <div class="dimension-toggle" id="dimension-toggle" role="group" aria-label="Color dots by">
            <button type="button" class="dimension-option" data-dimension="region" aria-pressed="true">Region</button>
            <button type="button" class="dimension-option" data-dimension="fieldOfWork" aria-pressed="false">Field of work</button>
          </div>
        </div>

        <div class="controls">
          <button type="button" id="play" class="ec-button primary">Pause</button>
          <button type="button" id="restart" class="ec-button outline">Restart</button>
          <div class="spacer"></div>
          <div id="stage-pills"></div>
          <button type="button" id="loop" class="ec-button pill" aria-pressed="true">Loop</button>
          <button type="button" class="ec-button pill" data-motion="orbit" aria-pressed="true">Orbit</button>
          <button type="button" class="ec-button pill" data-motion="pulse" aria-pressed="false">Pulse</button>
        </div>

        <p class="hint" id="hint"></p>
      </div>
    </div>

    <script src="funnel-data.js"></script>
    <script src="funnel-layout.js"></script>
    <script src="funnel.js"></script>
  </body>
</html>
